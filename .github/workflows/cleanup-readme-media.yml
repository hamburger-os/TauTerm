name: Cleanup README media

on:
  push:
    branches:
      - chore/purge-readme-media
    paths:
      - .github/workflows/cleanup-readme-media.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/purge-readme-media
          persist-credentials: true

      - name: Remove README video links and MP4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edits = {
              Path('README.md'): '[Watch the 64-second silent walkthrough](docs/assets/tauterm-demo.mp4).\n\n',
              Path('README.zh-CN.md'): '[观看 64 秒静音演示视频](docs/assets/tauterm-demo.mp4)。\n\n',
          }
          for path, needle in edits.items():
              text = path.read_text()
              if text.count(needle) != 1:
                  raise SystemExit(f'{path}: expected exactly one video link, got {text.count(needle)}')
              path.write_text(text.replace(needle, ''))
          PY
          git rm docs/assets/tauterm-demo.mp4
          ! grep -RIn --include='README*.md' 'tauterm-demo\.mp4\|\.gif' .
          git diff --check
          git diff -- README.md README.zh-CN.md
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove heavyweight README media"
          git push origin HEAD:chore/purge-readme-media

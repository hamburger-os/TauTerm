name: Serial review fixes one-shot

on:
  push:
    branches:
      - agent/serial-session-design-cleanup
    paths:
      - .github/workflows/serial-refactor-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/serial-session-design-cleanup
          fetch-depth: 0
      - name: Apply review fixes
        run: python3 scripts/_serial_review_fixes.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit generated changes
        run: |
          if git diff --quiet src src-tauri; then
            echo "No product changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          git commit -m "fix(serial): close review gaps in data and config paths"
          git push origin HEAD:agent/serial-session-design-cleanup
      - name: Confirm product commit
        run: git log -1 --oneline

name: Serial frontend refactor one-shot

on:
  push:
    branches:
      - agent/serial-session-design-cleanup
    paths:
      - .github/workflows/serial-refactor-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/serial-session-design-cleanup
          fetch-depth: 0
      - name: Apply frontend refactor
        run: python3 scripts/_serial_refactor_frontend.py
      - name: Commit generated changes
        run: |
          if git diff --quiet src; then
            echo "No product changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor(serial): move configuration and status into plugin"
          git push origin HEAD:agent/serial-session-design-cleanup

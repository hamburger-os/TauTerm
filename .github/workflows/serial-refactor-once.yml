name: Serial backend refactor one-shot

on:
  push:
    branches:
      - agent/serial-session-design-cleanup
    paths:
      - .github/workflows/serial-refactor-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/serial-session-design-cleanup
          fetch-depth: 0
      - name: Apply backend refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_serial_refactor_backend.py')
          text = path.read_text(encoding='utf-8')
          old = 'exact(p, "    subscribers: &mut Vec<(u64, mpsc::Sender<DataPlaneEvent>)>,\\n", "    subscribers: &mut Vec<(u64, mpsc::SyncSender<DataPlaneEvent>)>,\\n")'
          new = 'exact(p, "    subscribers: &mut Vec<(u64, mpsc::Sender<DataPlaneEvent>)>,\\n", "    subscribers: &mut Vec<(u64, mpsc::SyncSender<DataPlaneEvent>)>,\\n", count=2)'
          if old not in text:
              raise SystemExit('backend refactor guard target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/_serial_refactor_backend.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit generated changes
        run: |
          if git diff --quiet src-tauri; then
            echo "No product changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "refactor(serial): make virtual bridge lossless and typed"
          git push origin HEAD:agent/serial-session-design-cleanup

name: Security Review Hardening
on:
  push:
    branches: [hardening/cross-platform-release]
    paths: [scripts/review-hardening.py]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/cross-platform-release
          persist-credentials: true
      - run: python3 scripts/review-hardening.py
      - name: Format Rust
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "review: close TFTP and credential hardening findings"
          git push origin HEAD:hardening/cross-platform-release

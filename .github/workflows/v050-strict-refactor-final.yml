name: v0.5.0 Final Zero Warning Refactor

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate strict v0.5.0 refactor final' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Reassemble and verify strict refactor patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-parts/part* > /tmp/refactor.patch.gz.b64
          test "$(wc -c < /tmp/refactor.patch.gz.b64)" = "25348"
          echo "bf7742896f247fc54dc91c250a38e7aa7276c5cdc344e90f9f618245f772e79f  /tmp/refactor.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/refactor.patch.gz.b64 | gzip -dc > /tmp/refactor.patch
          test "$(wc -c < /tmp/refactor.patch)" = "98326"
          echo "27a45fa4fc00007b7e85747787724231684e00739ef529b92145bccbc212520f  /tmp/refactor.patch" | sha256sum -c -
          patch --dry-run -p1 < /tmp/refactor.patch
          patch -p1 < /tmp/refactor.patch

      - name: Normalize patched Rust before follow-up
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Apply strict follow-up fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("src-tauri/src/channel/async_io_loop.rs", "use std::sync::{mpsc, Arc};", "use std::sync::Arc;")
          replace("src-tauri/src/plugins/network/mod.rs", "use crate::channel::io_loop::{IoLoopCmd, IoLoopContext};", "use crate::channel::io_loop::IoLoopCmd;")
          replace("src-tauri/src/kernel/session_store.rs", "            plugin_id: plugin_id,", "            plugin_id,", 2)
          replace("src-tauri/src/kernel/session_store.rs", "            endpoint: endpoint,", "            endpoint,", 2)
          replace("src-tauri/src/transfer/serial_transfer.rs", "aggregate_total: aggregate_total,", "aggregate_total,", 2)
          replace("src-tauri/src/transfer/zmodem.rs", r'b"test.txt\000100 1234567890 100644 0 100"', r'b"test.txt\x0000100 1234567890 100644 0 100"')
          replace("src-tauri/src/transfer/zmodem.rs", r'b"test.txt\000100 1234567890"', r'b"test.txt\x0000100 1234567890"')
          replace(
              "src-tauri/src/plugins/iperf/server.rs",
              "    if let Ok(mut h) = server_handle.lock() {\n        *h = Some(handle);\n    }\n}",
              "    if let Ok(mut h) = server_handle.lock() {\n        *h = Some(handle);\n    };\n}",
          )

          Path("src-tauri/build.rs").write_text(r'''fn main() {
    // The service binary is produced by Cargo in the same build, while tauri-build
    // validates bundle.resources during the build-script phase. Create a placeholder
    // first; scripts/prepare-service-bin.js replaces it with the real binary before bundling.
    #[cfg(target_os = "windows")]
    {
        std::fs::create_dir_all("binaries")
            .expect("failed to create src-tauri/binaries for tauterm-service");
        let placeholder = std::path::Path::new("binaries").join("tauterm-service.exe");
        if !placeholder.exists() {
            std::fs::write(&placeholder, b"placeholder")
                .expect("failed to create tauterm-service.exe placeholder");
        }
    }

    tauri_build::build();

    #[cfg(target_os = "windows")]
    {
        let arch = std::env::var("CARGO_CFG_TARGET_ARCH")
            .expect("CARGO_CFG_TARGET_ARCH is unavailable");
        let arch_dir = match arch.as_str() {
            "x86_64" => "x64",
            "x86" => "x86",
            other => panic!(
                "com0com does not support target architecture {other}; refusing to build a package without required driver resources"
            ),
        };

        let base = std::path::Path::new("../resources/com0com");
        let src_dir = base.join(arch_dir);
        let required_files = [
            "setupc.exe",
            "setup.dll",
            "com0com.sys",
            "com0com.inf",
            "com0com.cat",
            "cncport.inf",
            "comport.inf",
        ];

        for file in required_files {
            let src = src_dir.join(file);
            let dst = base.join(file);
            assert!(src.exists(), "required com0com resource is missing: {}", src.display());
            std::fs::copy(&src, &dst).unwrap_or_else(|error| {
                panic!(
                    "failed to copy required com0com resource {} -> {}: {error}",
                    src.display(),
                    dst.display()
                )
            });
        }
    }
}
''', encoding="utf-8")

          vite = Path("vite.config.ts")
          vite_text = vite.read_text(encoding="utf-8")
          old = '''  build: {
    // xterm.js + framer-motion 总体积超过默认 500KB 限制，提高阈值
    chunkSizeWarningLimit: 800,
  },'''
          new = '''  build: {
    rollupOptions: {
      output: {
        // Split the largest runtime families instead of hiding Vite's chunk-size warning.
        manualChunks(id) {
          if (!id.includes("node_modules")) return undefined;
          if (id.includes("@xterm/")) return "xterm";
          if (id.includes("framer-motion") || id.includes("motion-dom") || id.includes("motion-utils")) return "motion";
          if (id.includes("react") || id.includes("scheduler")) return "react";
          if (id.includes("i18next")) return "i18n";
          if (id.includes("@tauri-apps/")) return "tauri";
          return "vendor";
        },
      },
    },
  },'''
          if vite_text.count(old) != 1:
              raise SystemExit("vite.config.ts: expected legacy chunkSizeWarningLimit block once")
          vite.write_text(vite_text.replace(old, new), encoding="utf-8")
          PY

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Reject Clippy suppressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            echo '::error::Clippy allow/expect suppression found.'
            exit 1
          fi

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -F "Some chunks are larger than" /tmp/frontend-build.log; then
            echo '::error::Vite emitted a large-chunk warning.'
            exit 1
          fi

      - name: Strict Clippy all targets
        run: cargo clippy --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify rustfmt and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            exit 1
          fi

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/src src-tauri/build.rs vite.config.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Strict refactor produced no source changes.'
            exit 1
          fi
          git commit -m 'refactor: eliminate all clippy warnings for v0.5.0'
          git pull --rebase origin master
          git push origin HEAD:master

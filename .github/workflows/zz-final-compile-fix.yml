name: Final Compile Fix

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Apply exact compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'src-tauri/src/plugins/modbus/value.rs',
              '#[derive(Debug, Clone, Copy, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum ValueType',
              '#[derive(Debug, Clone, Copy, PartialEq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum ValueType',
          )
          replace(
              'src-tauri/src/plugins/modbus/value.rs',
              '#[derive(Debug, Clone, Copy, Serialize, Deserialize)]\npub enum ByteOrder',
              '#[derive(Debug, Clone, Copy, PartialEq, Serialize, Deserialize)]\npub enum ByteOrder',
          )
          replace(
              'src-tauri/src/plugins/modbus/value.rs',
              '#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ValueFormat',
              '#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\npub struct ValueFormat',
          )

          replace(
              'src-tauri/src/plugins/modbus/mod.rs',
              '''    let handle = store\n        .get_session_mut(session_id)\n        .ok_or_else(|| store.session_not_found(session_id))?;\n''',
              '''    let not_found = store.session_not_found(session_id);\n    let handle = store.get_session_mut(session_id).ok_or(not_found)?;\n''',
          )

          replace(
              'src-tauri/src/plugins/network/mod.rs',
              '''    app_state\n        .session_store\n        .lock()\n        .map_err(|error| error.to_string())?\n        .register_peer_channel(\n            app,\n            log_tx,\n            PeerChannelRegistration {\n                parent_id: parent_id.to_string(),\n                peer_name: String::new(),\n                peer_addr,\n                local_addr,\n                runtime,\n                encoding,\n                data_mode,\n                peer_handles,\n                mirror_tx: Some(mirror_tx),\n            },\n        )\n''',
              '''    let result = app_state\n        .session_store\n        .lock()\n        .map_err(|error| error.to_string())?\n        .register_peer_channel(\n            app,\n            log_tx,\n            PeerChannelRegistration {\n                parent_id: parent_id.to_string(),\n                peer_name: String::new(),\n                peer_addr,\n                local_addr,\n                runtime,\n                encoding,\n                data_mode,\n                peer_handles,\n                mirror_tx: Some(mirror_tx),\n            },\n        );\n    result\n''',
          )
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/plugins/modbus/value.rs src-tauri/src/plugins/modbus/mod.rs src-tauri/src/plugins/network/mod.rs
          git diff --cached --check
          git commit -m '[final-fix-bot] fix final compile and formatting errors'
          git push origin HEAD:feat/transport-runtime-modbus

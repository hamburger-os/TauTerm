name: Strict Clippy Autofix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  autofix:
    if: "${{ github.event.head_commit.message == 'chore(ci): run clippy autofix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev
      - name: Apply machine-applicable Clippy fixes
        shell: bash
        run: |
          set +e
          cargo clippy --fix --allow-dirty --allow-staged --no-deps \
            --manifest-path src-tauri/Cargo.toml -- -D warnings
          true
      - name: Commit safe Rust fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply strict clippy suggestions"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Report remaining strict Clippy findings
        shell: bash
        run: |
          set +e
          cargo clippy --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings > clippy-remaining.log 2>&1
          status=$?
          cat clippy-remaining.log
          echo "$status" > clippy-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-remaining
          path: |
            clippy-remaining.log
            clippy-status.txt

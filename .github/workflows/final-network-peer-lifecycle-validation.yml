name: Final Network Peer Lifecycle Validation

on:
  push:
    branches:
      - refactor/plugin-boundary-cleanup

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Network peer lifecycle fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          mod = "src-tauri/src/plugins/network/mod.rs"
          replace_once(
              mod,
              '''    io: Arc<SessionIo>,\n    connected_at: Option<u64>,\n''',
              '''    io: Arc<SessionIo>,\n    connected_at: Option<u64>,\n    connected: bool,\n''',
              "peer runtime state",
          )

          replace_once(
              mod,
              '''    fn list_peers(&self) -> Vec<NetworkPeerInfo> {\n        let mut peers = self\n            .peers\n            .lock()\n            .map(|peers| {\n                peers\n                    .iter()\n                    .map(|(peer_id, peer)| NetworkPeerInfo {\n                        peer_id: peer_id.clone(),\n                        name: peer.name.clone(),\n                        addr: peer.addr.clone(),\n                        local_addr: peer.local_addr.clone(),\n                        state: "connected".to_string(),\n                        tx_bytes: peer.io.tx_bytes(),\n                        rx_bytes: peer.io.rx_bytes(),\n                        connected_at: peer.connected_at,\n                    })\n                    .collect::<Vec<_>>()\n            })\n            .unwrap_or_default();\n        peers.sort_by_key(|peer| {\n            self.peers\n                .lock()\n                .ok()\n                .and_then(|records| records.get(&peer.peer_id).map(|record| record.index))\n                .unwrap_or(u32::MAX)\n        });\n        peers\n    }\n''',
              '''    fn list_peers(&self) -> Vec<NetworkPeerInfo> {\n        let Ok(peers) = self.peers.lock() else {\n            return Vec::new();\n        };\n        let mut peers = peers\n            .iter()\n            .map(|(peer_id, peer)| {\n                (\n                    peer.index,\n                    NetworkPeerInfo {\n                        peer_id: peer_id.clone(),\n                        name: peer.name.clone(),\n                        addr: peer.addr.clone(),\n                        local_addr: peer.local_addr.clone(),\n                        state: if peer.connected {\n                            "connected".to_string()\n                        } else {\n                            "disconnected".to_string()\n                        },\n                        tx_bytes: peer.io.tx_bytes(),\n                        rx_bytes: peer.io.rx_bytes(),\n                        connected_at: peer.connected_at,\n                    },\n                )\n            })\n            .collect::<Vec<_>>();\n        peers.sort_by_key(|(index, _)| *index);\n        peers.into_iter().map(|(_, peer)| peer).collect()\n    }\n\n    fn mark_peer_disconnected(&self, peer_id: &str) {\n        if let Ok(mut handles) = self.peer_handles.lock() {\n            handles.remove(peer_id);\n        }\n        if let Ok(mut peers) = self.peers.lock() {\n            if let Some(peer) = peers.get_mut(peer_id) {\n                peer.connected = false;\n            }\n        }\n        if let Ok(mut target) = self.send_target.lock() {\n            if target.as_deref() == Some(peer_id) {\n                *target = None;\n            }\n        }\n    }\n\n    fn remove_peer(&self, peer_id: &str) {\n        self.mark_peer_disconnected(peer_id);\n        if let Ok(mut peers) = self.peers.lock() {\n            peers.remove(peer_id);\n        }\n    }\n''',
              "peer list and lifecycle",
          )

          replace_once(
              mod,
              '''    let io_for_disconnect = io.clone();\n    let peer_handles = core.peer_handles.clone();\n    let peers = core.peers.clone();\n    let disconnect_parent = core.role == "client";\n    let on_disconnect: Box<dyn Fn(String, DisconnectInfo) + Send> = Box::new(move |_id, info| {\n        if let Ok(mut handles) = peer_handles.lock() {\n            handles.remove(&peer_for_disconnect);\n        }\n        if let Ok(mut records) = peers.lock() {\n            records.remove(&peer_for_disconnect);\n        }\n''',
              '''    let io_for_disconnect = io.clone();\n    let core_for_disconnect = core.clone();\n    let disconnect_parent = core.role == "client";\n    let on_disconnect: Box<dyn Fn(String, DisconnectInfo) + Send> = Box::new(move |_id, info| {\n        core_for_disconnect.mark_peer_disconnected(&peer_for_disconnect);\n''',
              "disconnect metadata retention",
          )

          replace_once(
              mod,
              '''                io,\n                connected_at,\n            },\n''',
              '''                io,\n                connected_at,\n                connected: true,\n            },\n''',
              "peer insert connected state",
          )

          replace_once(
              mod,
              '''    pub fn list_peers(&self) -> Vec<NetworkPeerInfo> {\n        self.core.list_peers()\n    }\n\n    pub fn udp_send_to(&self, target: &str, data: &[u8]) -> Result<(), String> {\n''',
              '''    pub fn list_peers(&self) -> Vec<NetworkPeerInfo> {\n        self.core.list_peers()\n    }\n\n    pub fn remove_peer(&self, peer_id: &str) {\n        self.core.remove_peer(peer_id);\n    }\n\n    pub fn udp_send_to(&self, target: &str, data: &[u8]) -> Result<(), String> {\n''',
              "runtime peer removal",
          )

          commands = "src-tauri/src/plugins/network/commands.rs"
          replace_once(
              commands,
              '''    // 两段式：锁内信号 + 移除，锁外 join（同 close_channel）\n    let cleanup = {\n        let mut store = state.session_store.lock().map_err(|e| e.to_string())?;\n        let pid = store\n            .find_parent_of_channel(&session_id)\n            .ok_or_else(|| format!("对端 {} 未找到", session_id))?;\n        let (_is_last, cleanup) = store.close_sub_connection(&pid, &session_id)?;\n        cleanup\n    };\n    tauri::async_runtime::spawn_blocking(move || cleanup.join())\n        .await\n        .map_err(|error| format!("等待网络对端资源清理失败: {error}"))?;\n    Ok(())\n''',
              '''    // 两段式：锁内信号 + 移除，锁外 join（同 close_channel）。\n    // Network 插件自己的 peer 历史在 I/O 自然断开后继续保留；只有显式\n    // 关闭/清除命令完成资源回收后才删除元数据。\n    let (parent_id, cleanup) = {\n        let mut store = state.session_store.lock().map_err(|e| e.to_string())?;\n        let parent_id = store\n            .find_parent_of_channel(&session_id)\n            .ok_or_else(|| format!("对端 {} 未找到", session_id))?;\n        let (_is_last, cleanup) = store.close_sub_connection(&parent_id, &session_id)?;\n        (parent_id, cleanup)\n    };\n    tauri::async_runtime::spawn_blocking(move || cleanup.join())\n        .await\n        .map_err(|error| format!("等待网络对端资源清理失败: {error}"))?;\n    if let Some(runtime) = state\n        .plugin::<crate::plugins::network::NetworkAdapter>(crate::plugins::network::PLUGIN_ID)\n        .runtime(&parent_id)\n    {\n        runtime.remove_peer(&session_id);\n    }\n    Ok(())\n''',
              "explicit peer history removal",
          )
          PY
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Documentation contract
        run: npm run docs:check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Workspace architecture contract
        run: node scripts/check-workspace-ui-contract.mjs
      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Commit Network peer lifecycle fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/final-network-peer-lifecycle-validation.yml
          git add src-tauri/src/plugins/network/mod.rs src-tauri/src/plugins/network/commands.rs
          git diff --cached --check
          git commit -m 'fix: preserve network peer history until cleared'
          git push origin HEAD:refactor/plugin-boundary-cleanup

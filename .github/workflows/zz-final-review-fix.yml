name: Final Review Lifecycle Fix

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0

      - name: Apply lifecycle and terminology fix
        run: python3 .github/scripts/zz-final-review-fix.py

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate docs and TypeScript
        run: |
          npm run docs:check
          npx tsc --noEmit
          npm run check:file-transfer

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Validate Rust
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml transfer::scheduler

      - name: Commit final review fix and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/zz-final-review-fix.yml .github/scripts/zz-final-review-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close typed runtime lifecycle gaps'
          git push origin HEAD:feat/transport-runtime-modbus

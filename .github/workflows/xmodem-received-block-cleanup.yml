name: XModem received block cleanup

on:
  push:
    branches:
      - fix/transfer-role-aware-protocol-config
    paths:
      - .github/workflows/xmodem-received-block-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace complex tuple with named block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/transfer/xmodem.rs")
          text = p.read_text(encoding="utf-8")

          old_call = "        let (bnum, bnum_neg, data, valid) = read_data_block(port, header, check_mode)?;"
          new_call = '''        let ReceivedBlock {
              number: bnum,
              number_complement: bnum_neg,
              data,
              valid,
          } = read_data_block(port, header, check_mode)?;'''
          count = text.count(old_call)
          if count != 2:
              raise RuntimeError(f"expected two read_data_block tuple call sites, found {count}")
          text = text.replace(old_call, new_call)

          marker = "fn read_data_block(\n"
          if text.count(marker) != 1:
              raise RuntimeError("read_data_block marker mismatch")
          struct_def = '''struct ReceivedBlock {
              number: u8,
              number_complement: u8,
              data: Vec<u8>,
              valid: bool,
          }

          '''
          text = text.replace(marker, struct_def + marker, 1)

          old_sig = ") -> Result<(u8, u8, Vec<u8>, bool), Box<dyn std::error::Error>> {"
          new_sig = ") -> Result<ReceivedBlock, Box<dyn std::error::Error>> {"
          if text.count(old_sig) != 1:
              raise RuntimeError("read_data_block return signature mismatch")
          text = text.replace(old_sig, new_sig, 1)

          old_return = "    Ok((bnum, bnum_neg, data, valid))"
          new_return = '''    Ok(ReceivedBlock {
              number: bnum,
              number_complement: bnum_neg,
              data,
              valid,
          })'''
          if text.count(old_return) != 1:
              raise RuntimeError("read_data_block return expression mismatch")
          text = text.replace(old_return, new_return, 1)

          p.write_text(text, encoding="utf-8")
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/transfer/xmodem.rs
          git diff --cached --quiet && exit 0
          git commit -m "refactor(transfer): name received XModem blocks"
          git push

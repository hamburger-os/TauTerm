name: Feature branch maintenance

on:
  push:
    branches:
      - feat/transport-runtime-modbus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
      - name: Apply deterministic integration patch and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/commands.rs')
          text = path.read_text(encoding='utf-8')
          needle = '        "trdp" => crate::plugins::trdp::connect_session(app, state, request).await,\n'
          addition = needle + '        "modbus" => crate::plugins::modbus::connect_session(app, state, request).await,\n'
          if '"modbus" => crate::plugins::modbus::connect_session' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('expected exactly one TRDP connect dispatch anchor')
              text = text.replace(needle, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit maintenance result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src
          if git diff --cached --quiet; then
            echo 'No maintenance changes required.'
            exit 0
          fi
          git commit -m 'chore: format Rust and wire Modbus connection dispatch'
          git push origin HEAD:feat/transport-runtime-modbus

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.os }}-

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Strict Clippy all targets
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  hygiene:
    name: Frontend, formatting, version & hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pinned Rust toolchain
        run: npm run toolchain:check

      - name: Verify synchronized version metadata
        run: npm run version:check

      - name: Validate updater release scripts
        run: |
          node --check scripts/stage-release.js
          node --check scripts/assemble-release.js
          node --check scripts/verify-published-updater.js

      - name: Install pinned Rust toolchain for rustfmt
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -E 'Some chunks are larger than|circular dependency between chunks' /tmp/frontend-build.log; then
            echo '::error::Vite/Rollup emitted a production-build warning.'
            exit 1
          fi

      - name: Reject Clippy suppressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            echo '::error::Clippy allow/expect suppression found.'
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check

  v052-version-sync:
    name: One-shot v0.5.2 metadata sync
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/v0.5.2-trust-hygiene' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.5.2-trust-hygiene

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Synchronize exact v0.5.2 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.5.2 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('## [0.5.2]')) {
            const marker = '## [Unreleased]\n\n';
            if (!text.includes(marker)) throw new Error('Unreleased changelog marker not found');
            const release = [
              '## [0.5.2] — 2026-09-03',
              '',
              '### Security',
              '- **Credential storage trust closure** — adds cross-platform persistence contract tests for store/get/list/delete and reopen behavior, requires the headless Ubuntu CI leg to exercise the authenticated encrypted fallback, verifies the explicit v1 fallback envelope rejects unsupported versions fail-closed, retains AEAD tamper-detection coverage, and documents the credential-storage trust boundary in `SECURITY.md`. The v1 envelope is TauTerm’s first persisted fallback credential format, so there is no predecessor on-disk TauTerm format to migrate.',
              '',
            ].join('\n');
            fs.writeFileSync(path, text.replace(marker, marker + release + '\n'));
          }
          NODE
          npm run release:check -- 0.5.2

      - name: Restore permanent CI definition and commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f .github/workflows/v052-version-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): prepare v0.5.2 metadata'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

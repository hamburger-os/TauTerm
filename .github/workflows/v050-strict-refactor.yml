name: v0.5.0 Zero Warning Refactor

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate strict v0.5.0 refactor' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Install Tauri system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Apply strict refactor patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v050-strict-refactor.patch.gz.b64 | gzip -dc | git apply --check -
          base64 -d .github/v050-strict-refactor.patch.gz.b64 | gzip -dc | git apply -

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Reject Clippy suppressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            echo '::error::Clippy allow/expect suppression found. v0.5.0 requires zero ignored Clippy warnings.'
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend production build
        run: npm run build

      - name: Strict Clippy all targets
        run: cargo clippy --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify rustfmt is clean
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Strict refactor produced no source changes.'
            exit 1
          fi
          git commit -m 'refactor: eliminate clippy warnings for v0.5.0'
          git pull --rebase origin master
          git push origin HEAD:master

# TauTerm release workflow.
# Creates a draft release only after strict quality checks, builds all supported
# desktop targets, verifies updater signatures, and uploads a signed latest.json.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -E 'Some chunks are larger than|Circular chunk:' /tmp/frontend-build.log; then
            echo '::error::Vite/Rollup emitted a production-build warning.'
            exit 1
          fi

      - name: Reject Clippy suppressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            echo '::error::Clippy allow/expect suppression found.'
            exit 1
          fi

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Strict Clippy all targets
        run: cargo clippy --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        run: git diff --check

  create-release:
    name: Create Draft Release
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      releaseId: ${{ steps.create-release.outputs.release_id }}
    steps:
      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const prerelease = (context.payload.inputs && context.payload.inputs.prerelease === 'true') || false;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `TauTerm ${tag}`,
              body: 'See [CHANGELOG.md](https://github.com/hamburger-os/TauTerm/blob/master/CHANGELOG.md) for details.',
              draft: true,
              prerelease
            });
            core.setOutput('release_id', release.id.toString());

  build-windows:
    name: Windows x64 (NSIS + MSI)
    needs: [quality, create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check com0com driver files
        run: npm run check-com0com

      - name: Check com0com reserved-region sync
        run: npm run check-reserved-region

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: '--bundles nsis,msi'

  build-linux:
    name: Linux x64 (DEB + RPM + AppImage)
    needs: [quality, create-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libudev-dev \
            socat \
            rpm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: '--bundles deb,rpm,appimage'

  build-macos:
    name: macOS Apple Silicon (DMG + app)
    needs: [quality, create-release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: '--bundles dmg,app'

  build-macos-intel:
    name: macOS Intel x86_64 (DMG + app)
    needs: [quality, create-release]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: '--bundles dmg,app'

  update-manifest:
    name: Generate and Sign Update Manifest
    needs: [create-release, build-windows, build-linux, build-macos, build-macos-intel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install local Tauri CLI
        run: npm ci --no-audit --no-fund

      - name: Generate strict latest.json and detached signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ needs.create-release.outputs.releaseId }}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"

          ASSETS_JSON=$(gh api "repos/$REPO/releases/$RELEASE_ID" \
            --jq '[.assets[] | {name: .name, url: .browser_download_url}]')

          jq -n \
            --arg version "$VERSION" \
            --arg notes "See CHANGELOG.md for details." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {}}' > latest.json

          add_platform() {
            local target="$1"
            local suffix="$2"
            local entry name url sig_entry sig_url signature count

            count=$(echo "$ASSETS_JSON" | jq --arg suffix "$suffix" '[.[] | select(.name | endswith($suffix))] | length')
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one release asset ending with $suffix, found $count"
              exit 1
            fi

            entry=$(echo "$ASSETS_JSON" | jq -c --arg suffix "$suffix" '[.[] | select(.name | endswith($suffix))][0]')
            name=$(echo "$entry" | jq -r '.name')
            url=$(echo "$entry" | jq -r '.url')

            sig_entry=$(echo "$ASSETS_JSON" | jq -c --arg sig_name "$name.sig" '[.[] | select(.name == $sig_name)]')
            if [ "$(echo "$sig_entry" | jq 'length')" -ne 1 ]; then
              echo "::error::Missing unique updater signature asset: $name.sig"
              exit 1
            fi
            sig_url=$(echo "$sig_entry" | jq -r '.[0].url')
            signature=$(curl -fsSL --retry 3 --retry-delay 2 "$sig_url")
            if [ -z "$signature" ]; then
              echo "::error::Updater signature is empty: $name.sig"
              exit 1
            fi

            jq --arg target "$target" --arg sig "$signature" --arg url "$url" \
              '.platforms[$target] = {signature: $sig, url: $url}' latest.json > latest.tmp.json
            mv latest.tmp.json latest.json
          }

          add_platform windows-x86_64 '_x64-setup.exe'
          add_platform linux-x86_64 '_amd64.AppImage'
          add_platform darwin-aarch64 '_aarch64.app.tar.gz'
          add_platform darwin-x86_64 '_x64.app.tar.gz'

          jq -e '
            (.version == "0.5.0") and
            ((.platforms | keys | sort) == ["darwin-aarch64","darwin-x86_64","linux-x86_64","windows-x86_64"]) and
            (all(.platforms[]; ((.signature | length) > 0) and ((.url | length) > 0)))
          ' latest.json >/dev/null

          rm -f latest.json.sig
          npx tauri signer sign latest.json
          test -s latest.json.sig

          gh release upload "$TAG" latest.json latest.json.sig --repo "$REPO" --clobber
          echo '::notice::Strict signed updater manifest uploaded successfully.'

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, X.Y.Z-alpha.N, beta.N or rc.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tauterm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes_file: ${{ steps.meta.outputs.notes_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo '::error::Manual releases must be started from master.'
            exit 1
          fi

          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release version: $VERSION"
            exit 1
          fi

          TAG="v${VERSION}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          REMOTE_MASTER="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test -n "$REMOTE_MASTER"
          test "$REMOTE_MASTER" = "$SOURCE_SHA" || { echo '::error::master advanced before release preparation.'; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Release tags are immutable."
            exit 1
          fi

          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -c --arg tag "$TAG" '[.[] | select(.tag_name == $tag)]')"
          if [ "$(jq 'length' <<<"$EXISTING")" -gt 0 ]; then
            if ! jq -e 'all(.[]; .draft == true and (.assets | length) == 0)' <<<"$EXISTING" >/dev/null; then
              echo "::error::A non-empty or published GitHub Release already exists for $TAG."
              exit 1
            fi
          fi

          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          NOTES_FILE="docs/RELEASE_NOTES_${TAG}.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact Rust toolchain pin
        run: npm run toolchain:check
      - name: Verify release metadata
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/check-version.js --release "$VERSION"

  quality:
    name: Quality Gate
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}

  build-windows:
    name: Windows x64 NSIS
    needs: [prepare, quality]
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: release-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: release-rust-${{ runner.os }}-
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
      - name: Build NSIS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis
      - name: Stage and smoke-test Windows release files
        run: node scripts/stage-release.js windows release-stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-stage/*
          if-no-files-found: error
          retention-days: 2

  build-linux:
    name: Linux x64 packages (Ubuntu 22.04 baseline)
    needs: [prepare, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: release-rust-${{ runner.os }}-22-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: release-rust-${{ runner.os }}-22-
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libudev-dev rpm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
      - name: Build Linux bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Stage Linux release files
        run: node scripts/stage-release.js linux release-stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release-stage/*
          if-no-files-found: error
          retention-days: 2

  build-macos-arm:
    name: macOS Apple Silicon packages
    needs: [prepare, quality]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: release-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: release-rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
      - name: Build macOS bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles dmg,app
      - name: Stage Apple Silicon release files
        run: node scripts/stage-release.js macos-arm release-stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm
          path: release-stage/*
          if-no-files-found: error
          retention-days: 2

  assemble:
    name: Verify and attest release artifacts
    needs: [prepare, build-windows, build-linux, build-macos-arm]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq minisign
      - name: Verify updater signatures and assemble manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/assemble-release.js "$TAG" "$VERSION" release-assets
      - name: Attest final release files
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish release
    needs: [prepare, assemble]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ready
          path: release-assets
      - name: Create tag and publish only after all validation succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          NOTES_FILE: ${{ needs.prepare.outputs.notes_file }}
        run: |
          set -euo pipefail
          CREATED_TAG=false
          CREATED_RELEASE=false
          PUBLISHED=false
          cleanup() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$PUBLISHED" != "true" ]; then
              [ "$CREATED_RELEASE" = "true" ] && gh release delete "$TAG" --yes --cleanup-tag=false >/dev/null 2>&1 || true
              [ "$CREATED_TAG" = "true" ] && git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
            fi
            exit "$code"
          }
          trap cleanup EXIT

          REMOTE_MASTER="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$REMOTE_MASTER" = "$SOURCE_SHA" || { echo '::error::master advanced during release builds.'; exit 1; }
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || { echo "::error::$TAG already exists."; exit 1; }

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true and (.assets | length) == 0) | .id' | \
            while read -r id; do [ -n "$id" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SOURCE_SHA" -m "TauTerm $TAG"
          git push origin "refs/tags/$TAG"
          CREATED_TAG=true

          CREATE_ARGS=("$TAG" --target "$SOURCE_SHA" --title "TauTerm $TAG" --notes-file "$NOTES_FILE" --draft)
          [ "$PRERELEASE" = "true" ] && CREATE_ARGS+=(--prerelease)
          gh release create "${CREATE_ARGS[@]}"
          CREATED_RELEASE=true
          gh release upload "$TAG" release-assets/*

          REMOTE_RELEASE=/tmp/tauterm-release.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" > "$REMOTE_RELEASE"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/local-assets.txt
          jq -r '.assets[].name' "$REMOTE_RELEASE" | LC_ALL=C sort > /tmp/remote-assets.txt
          diff -u /tmp/local-assets.txt /tmp/remote-assets.txt

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          PUBLISHED=true

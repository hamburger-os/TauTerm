name: Protocol DataPlane Migration

on:
  push:
    branches:
      - feat/transport-runtime-modbus

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Migrate protocol drivers to DataPlane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src-tauri/src')

          # Fix the close-metadata helper generated by the previous migration.
          p = root / 'transport/runtime.rs'
          s = p.read_text()
          s = s.replace('''    fn from_driver(\n        kind: TransportErrorKind,\n        reason: impl Into<String>,\n        exit_code: None,\n        signal: None,\n        metadata: StreamCloseMetadata,\n    ) -> Self {''', '''    fn from_driver(\n        kind: TransportErrorKind,\n        reason: impl Into<String>,\n        metadata: StreamCloseMetadata,\n    ) -> Self {''')
          p.write_text(s)

          # Add an explicit protocol/session attachment capability. Transport remains session-agnostic.
          p = root / 'kernel/plugin_adapter.rs'
          s = p.read_text()
          marker = '''pub trait SideChannel: Send + Sync {'''
          attach = '''pub trait SessionAttach: Send + Sync {\n    fn on_attached(&self, session_id: &str);\n}\n\n'''
          if attach not in s:
              s = s.replace(marker, attach + marker)
          s = s.replace('''    pub channel_factory: Option<Arc<dyn SessionChannelFactory>>,\n    pub teardown_delay: std::time::Duration,''', '''    pub channel_factory: Option<Arc<dyn SessionChannelFactory>>,\n    pub on_attached: Option<Arc<dyn SessionAttach>>,\n    pub teardown_delay: std::time::Duration,''')
          p.write_text(s)

          # Add the new field to already-migrated constructors. Telnet is handled specially below.
          for rel in [
              'plugins/serial/mod.rs', 'plugins/local_shell/mod.rs', 'plugins/iperf/mod.rs',
              'plugins/tftp/mod.rs', 'plugins/modbus/mod.rs', 'plugins/network/mod.rs'
          ]:
              p = root / rel
              s = p.read_text()
              s = re.sub(r'(channel_factory:\s*[^,]+,\n)(\s*)(teardown_delay:)', r'\1\2on_attached: None,\n\2\3', s)
              p.write_text(s)

          # Migrate simple adapter imports / constructors away from the deleted ChannelKind/io_strategy contract.
          for rel in ['plugins/iperf/mod.rs', 'plugins/tftp/mod.rs', 'plugins/modbus/mod.rs']:
              p = root / rel
              s = p.read_text()
              s = s.replace('use crate::channel::error::SessionError;', 'use crate::session::SessionError;')
              s = s.replace('use crate::channel::{ContentType, IoStrategy};', 'use crate::kernel::plugin_adapter::ContentType;')
              s = s.replace('use crate::channel::ContentType;', 'use crate::kernel::plugin_adapter::ContentType;')
              s = re.sub(r'\n\s*fn io_strategy\(&self\) -> IoStrategy \{\n\s*IoStrategy::(?:Sync|Async)\n\s*\}\n', '\n', s)
              s = s.replace('            channel: None,\n            comm_handle: None,', '            data_plane: None,')
              p.write_text(s)

          # SSH: move the russh channel implementation into the plugin and implement AsyncByteStream.
          old = root / 'channel/ssh_channel.rs'
          driver = root / 'plugins/ssh/driver.rs'
          driver.write_text(r'''//! SSH transport driver. Async russh details are confined to the transport boundary.

use std::collections::VecDeque;
use std::sync::Arc;

use crate::plugins::ssh::handler::SshHandler;
use crate::transport::{AsyncByteStream, ReadStatus, StreamCloseMetadata, TransportError, TransportErrorKind};

pub struct SshDriver {
    channel: russh::Channel<russh::client::Msg>,
    _handle: Arc<russh::client::Handle<SshHandler>>,
    pending: VecDeque<u8>,
    exit_status: Option<u32>,
    exit_signal: Option<String>,
}

impl SshDriver {
    pub fn new(
        channel: russh::Channel<russh::client::Msg>,
        handle: Arc<russh::client::Handle<SshHandler>>,
    ) -> Self {
        Self {
            channel,
            _handle: handle,
            pending: VecDeque::new(),
            exit_status: None,
            exit_signal: None,
        }
    }

    fn drain_pending(&mut self, buf: &mut [u8]) -> usize {
        let n = buf.len().min(self.pending.len());
        for slot in &mut buf[..n] {
            *slot = self.pending.pop_front().expect("pending length checked");
        }
        n
    }

    fn deliver_chunk(&mut self, chunk: &[u8], buf: &mut [u8]) -> ReadStatus {
        let n = chunk.len().min(buf.len());
        buf[..n].copy_from_slice(&chunk[..n]);
        if n < chunk.len() {
            self.pending.extend(&chunk[n..]);
        }
        ReadStatus::Data(n)
    }
}

#[async_trait::async_trait]
impl AsyncByteStream for SshDriver {
    async fn read(&mut self, buf: &mut [u8]) -> Result<ReadStatus, TransportError> {
        if buf.is_empty() {
            return Ok(ReadStatus::Idle);
        }
        if !self.pending.is_empty() {
            return Ok(ReadStatus::Data(self.drain_pending(buf)));
        }
        loop {
            match self.channel.wait().await {
                Some(russh::ChannelMsg::Data { data }) => {
                    return Ok(self.deliver_chunk(data.as_ref(), buf));
                }
                Some(russh::ChannelMsg::ExtendedData { data, ext }) if ext == 1 => {
                    return Ok(self.deliver_chunk(data.as_ref(), buf));
                }
                Some(russh::ChannelMsg::ExtendedData { .. }) => continue,
                Some(russh::ChannelMsg::ExitStatus { exit_status }) => {
                    self.exit_status = Some(exit_status);
                }
                Some(russh::ChannelMsg::ExitSignal { signal_name, .. }) => {
                    self.exit_signal = Some(format!("{signal_name:?}"));
                }
                Some(russh::ChannelMsg::Eof) | Some(russh::ChannelMsg::Close) | None => {
                    return Ok(ReadStatus::Eof);
                }
                Some(_) => {}
            }
        }
    }

    async fn write_all(&mut self, data: &[u8]) -> Result<(), TransportError> {
        self.channel.data(data).await.map_err(|error| {
            TransportError::new(TransportErrorKind::Io, "ssh_write", error.to_string())
        })
    }

    async fn flush(&mut self) -> Result<(), TransportError> {
        Ok(())
    }

    async fn shutdown(&mut self) -> Result<(), TransportError> {
        Ok(())
    }

    async fn resize_terminal(&mut self, cols: u32, rows: u32) -> Result<(), TransportError> {
        self.channel.window_change(cols, rows, 0, 0).await.map_err(|error| {
            TransportError::new(TransportErrorKind::Io, "ssh_resize_terminal", error.to_string())
        })
    }

    fn supports_terminal_control(&self) -> bool {
        true
    }

    fn close_metadata(&self) -> StreamCloseMetadata {
        StreamCloseMetadata {
            exit_code: self.exit_status,
            signal: self.exit_signal.clone(),
        }
    }
}
''')
          if old.exists():
              old.unlink()

          p = root / 'plugins/ssh/mod.rs'
          s = p.read_text()
          if 'mod driver;' not in s:
              s = s.replace('pub mod handler;', 'mod driver;\npub mod handler;')
          s = s.replace('use crate::channel::error::SessionError;', 'use crate::session::SessionError;')
          s = s.replace('use crate::channel::ssh_channel::SshChannel;\n', '')
          s = s.replace('use crate::channel::{ContentType, IoStrategy};', 'use crate::kernel::plugin_adapter::ContentType;')
          s = s.replace('''    ChannelKind, ChannelOpenMode, EndpointInfo, ProtocolAdapter, ProtocolConnection,\n    SessionChannelFactory, SideChannel, TransferProtocolType,''', '''    ChannelOpenMode, EndpointInfo, ProtocolAdapter, ProtocolConnection, SessionChannelFactory,\n    SideChannel, TransferProtocolType,''')
          if 'use crate::transport::{AsyncBridgeDriver, DataPlaneRuntime};' not in s:
              s = s.replace('use handler::SshHandler;', 'use crate::transport::{AsyncBridgeDriver, DataPlaneRuntime};\nuse driver::SshDriver;\nuse handler::SshHandler;')
          s = s.replace('''        Ok(ProtocolConnection {\n            channel: Some(crate::kernel::plugin_adapter::ChannelKind::Async(Box::new(\n                result.channel,\n            ))),\n            comm_handle: None,\n            side_channel: Some(shared.clone()),\n            channel_factory: Some(shared),\n            teardown_delay: self.teardown_delay(),\n        })''', '''        let bridge = AsyncBridgeDriver::new(Box::new(result.driver))?;\n        Ok(ProtocolConnection {\n            data_plane: Some(DataPlaneRuntime::spawn(Box::new(bridge))),\n            side_channel: Some(shared.clone()),\n            channel_factory: Some(shared),\n            on_attached: None,\n            teardown_delay: self.teardown_delay(),\n        })''')
          s = s.replace('    channel: SshChannel,', '    driver: SshDriver,')
          s = s.replace(') -> Result<SshChannel, SessionError> {', ') -> Result<SshDriver, SessionError> {')
          s = s.replace('    let ssh_channel = SshChannel::new(channel, handle);\n\n    Ok(ssh_channel)', '    Ok(SshDriver::new(channel, handle))')
          s = s.replace('        channel: ssh_channel,', '        driver: ssh_channel,')
          s = s.replace('''        Ok(ChannelKind::Async(Box::new(\n            open_pty_shell_channel(self.handle()).await?,\n        )))''', '''        let driver = open_pty_shell_channel(self.handle()).await?;\n        let bridge = AsyncBridgeDriver::new(Box::new(driver))?;\n        Ok(DataPlaneRuntime::spawn(Box::new(bridge)))''')
          s = re.sub(r'\n\s*fn io_strategy\(&self\) -> IoStrategy \{.*?\n\s*\}\n', '\n', s, flags=re.S)
          p.write_text(s)

          # Telnet driver: protocol parsing remains in the plugin, physical stream ownership moves to DataPlane.
          p = root / 'plugins/telnet/channel.rs'
          s = p.read_text()
          s = s.replace('//! Telnet 通道实现', '//! Telnet transport driver')
          s = s.replace('use crate::channel::{error::ChannelError, Channel};', 'use crate::transport::{BlockingByteStream, ReadStatus, TransportError, TransportErrorKind};')
          s = s.replace('pub struct TelnetChannel', 'pub struct TelnetDriver')
          s = s.replace('impl TelnetChannel', 'impl TelnetDriver')
          # Keep std Read/Write helpers as private implementation, then expose the transport trait.
          s = s.replace('impl Channel for TelnetDriver {', 'impl BlockingByteStream for TelnetDriver {')
          start = s.find('impl BlockingByteStream for TelnetDriver {')
          if start != -1:
              # Replace the old Channel implementation wholesale.
              depth = 0
              end = None
              for i in range(start, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              block = r'''impl BlockingByteStream for TelnetDriver {
    fn read(&mut self, buf: &mut [u8]) -> Result<ReadStatus, TransportError> {
        match Read::read(self, buf) {
            Ok(0) => Ok(ReadStatus::Idle),
            Ok(n) => Ok(ReadStatus::Data(n)),
            Err(error) if error.kind() == ErrorKind::UnexpectedEof => Ok(ReadStatus::Eof),
            Err(error) if matches!(error.kind(), ErrorKind::TimedOut | ErrorKind::WouldBlock) => Ok(ReadStatus::Idle),
            Err(error) => Err(TransportError::io("telnet_read", error)),
        }
    }

    fn write_all(&mut self, data: &[u8]) -> Result<(), TransportError> {
        Write::write_all(self, data).map_err(|error| TransportError::io("telnet_write", error))
    }

    fn flush(&mut self) -> Result<(), TransportError> {
        Write::flush(self).map_err(|error| TransportError::io("telnet_flush", error))
    }

    fn shutdown(&mut self) -> Result<(), TransportError> {
        self.connected = false;
        Ok(())
    }

    fn resize_terminal(&mut self, cols: u32, rows: u32) -> Result<(), TransportError> {
        let w = cols.clamp(1, u16::MAX as u32) as u16;
        let h = rows.clamp(1, u16::MAX as u32) as u16;
        let payload = [(w >> 8) as u8, (w & 0xFF) as u8, (h >> 8) as u8, (h & 0xFF) as u8];
        self.telnet.subnegotiate(TelnetOption::NAWS, &payload).map_err(|error| {
            TransportError::new(TransportErrorKind::Io, "telnet_naws", error.to_string())
        })
    }

    fn supports_terminal_control(&self) -> bool {
        true
    }
}
'''
              s = s[:start] + block + s[end:]
          p.write_text(s)

          p = root / 'plugins/telnet/mod.rs'
          s = p.read_text()
          s = s.replace('use crate::channel::error::SessionError;', 'use crate::session::SessionError;')
          s = s.replace('use crate::channel::{ContentType, IoStrategy};', 'use crate::kernel::plugin_adapter::ContentType;')
          s = s.replace('''    ChannelKind, EndpointInfo, ProtocolAdapter, ProtocolConnection, TransferProtocolType,''', '''    EndpointInfo, ProtocolAdapter, ProtocolConnection, SessionAttach, TransferProtocolType,''')
          s = s.replace('use channel::{TelnetChannel, READ_TIMEOUT};', 'use channel::{TelnetDriver, READ_TIMEOUT};\nuse crate::transport::DataPlaneRuntime;')
          s = s.replace('let channel = TelnetChannel::new(telnet, probe, on_echo_change, session_id_slot);', 'let driver = TelnetDriver::new(telnet, probe, on_echo_change, session_id_slot.clone());')
          s = s.replace('''        Ok(ProtocolConnection {\n            channel: Some(ChannelKind::Sync(Box::new(channel))),\n            comm_handle: None,\n            side_channel: None,\n            channel_factory: None,\n            teardown_delay: self.teardown_delay(),\n        })''', '''        Ok(ProtocolConnection {\n            data_plane: Some(DataPlaneRuntime::spawn(Box::new(driver))),\n            side_channel: None,\n            channel_factory: None,\n            on_attached: Some(Arc::new(TelnetSessionAttach { slot: session_id_slot })),\n            teardown_delay: self.teardown_delay(),\n        })''')
          s = re.sub(r'\n\s*fn io_strategy\(&self\) -> IoStrategy \{\n\s*IoStrategy::Sync\n\s*\}\n', '\n', s)
          insert = '''\nstruct TelnetSessionAttach {\n    slot: Arc<Mutex<Option<String>>>,\n}\n\nimpl SessionAttach for TelnetSessionAttach {\n    fn on_attached(&self, session_id: &str) {\n        if let Ok(mut slot) = self.slot.lock() {\n            *slot = Some(session_id.to_string());\n        }\n    }\n}\n'''
          if 'struct TelnetSessionAttach' not in s:
              pos = s.index('// ── Telnet 适配器')
              s = s[:pos] + insert + '\n' + s[pos:]
          p.write_text(s)

          # Remove the old SSH module declaration and legacy-only adapter methods/imports.
          p = root / 'channel/mod.rs'
          s = p.read_text().replace('pub mod ssh_channel;\n', '')
          p.write_text(s)

          # Network is still a container protocol; switch only its adapter-level contract here.
          p = root / 'plugins/network/mod.rs'
          s = p.read_text()
          s = s.replace('use crate::channel::error::SessionError;', 'use crate::session::SessionError;')
          s = s.replace('    ChannelKind, ProtocolAdapter, ProtocolConnection, SideChannel,', '    ProtocolAdapter, ProtocolConnection, SideChannel,')
          s = s.replace('    fn content_type(&self) -> crate::channel::ContentType {\n        crate::channel::ContentType::Custom\n    }', '    fn content_type(&self) -> crate::kernel::plugin_adapter::ContentType {\n        crate::kernel::plugin_adapter::ContentType::Custom\n    }')
          s = re.sub(r'\n\s*fn io_strategy\(&self\) -> crate::channel::IoStrategy \{\n\s*crate::channel::IoStrategy::Sync\n\s*\}\n', '\n', s)
          # NetworkCommHandle remains until peer/session migration, so don't fabricate a ProtocolConnection field.
          s = s.replace('''        Ok(ProtocolConnection {\n            channel: None,\n            comm_handle: Some(comm_handle),\n            side_channel: Some(side),\n            channel_factory: None,\n            on_attached: None,\n            teardown_delay: self.teardown_delay(),\n        })''', '''        drop(comm_handle);\n        Ok(ProtocolConnection {\n            data_plane: None,\n            side_channel: Some(side),\n            channel_factory: None,\n            on_attached: None,\n            teardown_delay: self.teardown_delay(),\n        })''')
          p.write_text(s)

          # rustfmt-sensitive files touched by earlier direct commits.
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit protocol migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[protocol-dataplane-bot] migrate SSH and Telnet transport drivers'
          git push origin HEAD:feat/transport-runtime-modbus

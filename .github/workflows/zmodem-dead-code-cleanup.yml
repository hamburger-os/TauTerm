name: ZModem dead-code cleanup

on:
  push:
    branches:
      - fix/transfer-role-aware-protocol-config
    paths:
      - scripts/remove_zmodem_dead_const.py
      - .github/workflows/zmodem-dead-code-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete constant
        run: python scripts/remove_zmodem_dead_const.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/transfer/zmodem.rs
          git diff --cached --quiet && exit 0
          git commit -m "chore(transfer): remove obsolete ZModem constant"
          git push

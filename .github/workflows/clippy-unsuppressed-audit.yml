name: Unsuppressed Clippy Audit

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore(ci): audit all clippy warnings' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev
      - name: Remove Clippy suppressions in audit workspace
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/src -type f -name '*.rs' -print0 | xargs -0 sed -i -E '/#\[(allow|expect)\(clippy::/d'
      - name: Strict unsuppressed Clippy audit
        shell: bash
        run: |
          set +e
          cargo clippy --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings > clippy-unsuppressed.log 2>&1
          status=$?
          cat clippy-unsuppressed.log
          echo "$status" > clippy-unsuppressed-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: clippy-unsuppressed
          path: |
            clippy-unsuppressed.log
            clippy-unsuppressed-status.txt

name: Reliability Soak

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to validate
        required: false
        type: string
      duration_seconds:
        description: Soak duration in seconds (5-14400)
        required: false
        default: "3600"
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate
        required: false
        type: string
      duration_seconds:
        description: Soak duration in seconds (5-14400)
        required: false
        default: "300"
        type: string
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

jobs:
  soak:
    name: Repeated I/O lifecycle soak
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Resolve soak duration
        id: duration
        shell: bash
        env:
          REQUESTED: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          SECONDS="${REQUESTED:-3600}"
          [[ "$SECONDS" =~ ^[0-9]+$ ]] || { echo "::error::duration must be numeric"; exit 1; }
          (( SECONDS >= 5 && SECONDS <= 14400 )) || { echo "::error::duration must be 5-14400"; exit 1; }
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Run release-mode lifecycle soak
        shell: bash
        env:
          TAUTERM_SOAK_SECONDS: ${{ steps.duration.outputs.seconds }}
          TAUTERM_SOAK_OUTPUT: ${{ github.workspace }}/soak-contract.json
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml \
            reliability_soak_repeated_io_lifecycle -- --ignored --nocapture \
            | tee soak-contract.log
          test -s soak-contract.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-soak-${{ github.sha }}
          path: |
            soak-contract.json
            soak-contract.log
          retention-days: 30

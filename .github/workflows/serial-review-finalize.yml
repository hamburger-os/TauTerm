name: Serial review finalize one-shot

on:
  push:
    branches:
      - agent/serial-session-design-cleanup
    paths:
      - .github/workflows/serial-review-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/serial-session-design-cleanup
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Current Session Library schema is intentionally breaking; old v1 snapshots are backed up,
          # not migrated. The previous v1 contained duplicated virtual-port top-level fields.
          replace('src-tauri/src/kernel/session_store.rs',
                  'const SESSION_LIBRARY_VERSION: u32 = 1;',
                  'const SESSION_LIBRARY_VERSION: u32 = 2;')
          replace('src-tauri/src/kernel/session_store.rs',
                  '''            params: serde_json::json!({"baud_rate": 115200}),\n            timestamp,\n            transfer_enabled: true,\n            transfer_protocol: Some("ymodem".into()),\n            send_bar_enabled: true,\n            virtual_port_enabled: false,\n            virtual_port_count: 0,\n''',
                  '''            params: serde_json::json!({\n                "baud_rate": 115200,\n                "data_bits": 8,\n                "parity": "none",\n                "stop_bits": "1",\n                "flow_control": "none",\n                "data_mode": "text",\n                "dual_frame_timeout_ms": 50,\n                "encoding": "utf-8",\n                "virtual_port_enabled": false,\n                "virtual_port_count": 1\n            }),\n            timestamp,\n            transfer_enabled: true,\n            transfer_protocol: Some("ymodem".into()),\n            send_bar_enabled: true,\n''')
          replace('src-tauri/src/kernel/session_store.rs',
                  'assert!(raw.contains("\\\"version\\\": 1"));',
                  'assert!(raw.contains("\\\"version\\\": 2"));')

          # Transport wire schema is strict: defaults are for explicit new-config construction only.
          p = Path('src-tauri/src/transport/serial.rs')
          text = p.read_text(encoding='utf-8')
          for attr in [
              '    #[serde(default = "default_baud_rate")]\n',
              '    #[serde(default = "default_data_bits")]\n',
              '    #[serde(default = "default_parity")]\n',
              '    #[serde(default = "default_stop_bits")]\n',
              '    #[serde(default = "default_flow_control")]\n',
          ]:
              if text.count(attr) != 1:
                  raise SystemExit(f'serial.rs: expected one {attr!r}')
              text = text.replace(attr, '', 1)
          p.write_text(text, encoding='utf-8')

          # Frontend normalization strips non-Serial fields but never manufactures missing link fields.
          replace('src/plugins/serial/SerialConnectForm.tsx',
                  '''export function normalizeSerialParams(params: Record<string, unknown>): Record<string, unknown> {\n  const normalized: Record<string, unknown> = { ...DEFAULT_SERIAL_PARAMS };\n  for (const key of SERIAL_PARAM_KEYS) {\n    if (params[key] !== undefined) normalized[key] = params[key];\n  }\n  return normalized;\n}\n''',
                  '''export function normalizeSerialParams(params: Record<string, unknown>): Record<string, unknown> {\n  const normalized: Record<string, unknown> = {};\n  for (const key of SERIAL_PARAM_KEYS) {\n    if (params[key] !== undefined) normalized[key] = params[key];\n  }\n  return normalized;\n}\n''')

          # Lock the strict backend contract with a missing-field test.
          anchor = '''    #[test]\n    fn malformed_transport_field_is_rejected_instead_of_falling_back_to_defaults() {\n'''
          insertion = '''    #[test]\n    fn missing_transport_field_is_rejected_instead_of_being_repaired() {\n        let error = SerialAdapter::parse_transport_params(&serde_json::json!({\n            "baud_rate": 115200,\n            "data_bits": 8,\n            "parity": "none",\n            "stop_bits": "1"\n        }))\n        .unwrap_err();\n        assert!(matches!(error, SessionError::Config(_)));\n    }\n\n    #[test]\n    fn malformed_transport_field_is_rejected_instead_of_falling_back_to_defaults() {\n'''
          replace('src-tauri/src/plugins/serial/mod.rs', anchor, insertion)
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri
          git diff --cached --quiet && { echo "No product changes"; exit 1; }
          git commit -m "fix(serial): enforce current configuration schema"
          git push origin HEAD:agent/serial-session-design-cleanup

name: TRDP Native

on:
  pull_request:
    branches: [master]
    paths:
      - 'src-tauri/vendor/tcnopen/**'
      - 'src-tauri/native/trdp_bridge*'
      - 'src-tauri/native/CMakeLists.txt'
      - 'src-tauri/src/plugins/trdp.rs'
      - 'src-tauri/src/plugins/trdp/**'
      - 'src/plugins/trdp/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/tauri.windows.conf.json'
      - 'scripts/prepare-service-bin.js'
      - 'scripts/bootstrap-trdp.sh'
      - 'scripts/bootstrap-trdp.ps1'
      - 'scripts/vendor_tcnopen.py'
      - 'scripts/stage-release.js'
      - 'tools/trdp-test-peer/**'
      - '.github/workflows/trdp-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trdp-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Native TRDP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify vendored source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/vendor_tcnopen.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("src-tauri/vendor/tcnopen/SOURCE.json").read_text())
          assert meta["version"] == "3.0.0.0"
          assert meta["license"] == "MPL-2.0"
          assert Path("src-tauri/vendor/tcnopen/src/api/trdp_if_light.h").is_file()
          assert Path("src-tauri/vendor/tcnopen/src/common/trdp_private.h").is_file()
          PY

      - name: Build vendored TCNOpen 3.0.0.0 and native helpers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export TAUTERM_TRDP_SANITIZE=1
            export ASAN_OPTIONS="abort_on_error=1:detect_leaks=0"
            export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          fi
          bash scripts/bootstrap-trdp.sh

      - name: Verify native artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -x src-tauri/binaries/tauterm-trdp-bridge
          test -x tools/trdp-test-peer/bin/trdp-test-peer
          file src-tauri/binaries/tauterm-trdp-bridge
          file tools/trdp-test-peer/bin/trdp-test-peer

      - name: Verify capture interface enumeration
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE="$PWD/src-tauri/binaries/tauterm-trdp-bridge"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export ASAN_OPTIONS="abort_on_error=1:detect_leaks=0"
            export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          fi
          OUTPUT="$(printf '%s\n' '{"command":"capture_list"}' '{"command":"shutdown"}' | "$BRIDGE")"
          printf '%s\n' "$OUTPUT"
          grep -q '"event":"capture_interfaces"' <<<"$OUTPUT"
          grep -q '"interfaces":\[' <<<"$OUTPUT"

      - name: Linux TCNOpen interoperability
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE="$PWD/src-tauri/binaries/tauterm-trdp-bridge"
          PEER="$PWD/tools/trdp-test-peer/bin/trdp-test-peer"
          export ASAN_OPTIONS="abort_on_error=1:detect_leaks=0"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          export TAUTERM_TRDP_DEBUG=1
          PULL_NS_A="trdp-pull-a"
          PULL_NS_B="trdp-pull-b"
          AB_NS_A="trdp-ab-a"
          AB_NS_B="trdp-ab-b"
          cleanup_pull_netns() {
            sudo ip netns del "$PULL_NS_A" 2>/dev/null || true
            sudo ip netns del "$PULL_NS_B" 2>/dev/null || true
            sudo ip netns del "$AB_NS_A" 2>/dev/null || true
            sudo ip netns del "$AB_NS_B" 2>/dev/null || true
            sudo ip link del trdp-ab-ha 2>/dev/null || true
            sudo ip link del trdp-ab-hb 2>/dev/null || true
          }
          dump_logs() {
            status=$?
            cleanup_pull_netns
            if [[ $status -ne 0 ]]; then
              echo "=== TRDP interop diagnostics ==="
              for log in /tmp/trdp-peer-*.log /tmp/trdp-bridge-*.log; do
                if [[ -f "$log" ]]; then
                  echo "--- $log ---"
                  cat "$log"
                fi
              done
            fi
            exit $status
          }
          trap dump_logs EXIT

          "$PEER" pd-publisher 127.0.0.2 127.0.0.1 7001 4 >/tmp/trdp-peer-pd.log 2>&1 &
          PD_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-pd-sub","kind":"pd_subscriber","com_id":7001,"source":"127.0.0.2","destination":"127.0.0.1","timeout_us":500000}}'
            sleep 2
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-pd.log 2>&1
          wait "$PD_PID"
          grep -q '"com_id":7001' /tmp/trdp-bridge-pd.log

          # TCNOpen rejects a second 127/8 alias on Linux as a multi-home
          # mismatch because IP_PKTINFO reports loopback as 127.0.0.1. Use two
          # real veth interfaces so each TCNOpen application session sees the
          # same realIP that the kernel reports for received packets.
          cleanup_pull_netns
          sudo ip netns add "$PULL_NS_A"
          sudo ip netns add "$PULL_NS_B"
          sudo ip link add trdp-va type veth peer name trdp-vb
          sudo ip link set trdp-va netns "$PULL_NS_A"
          sudo ip link set trdp-vb netns "$PULL_NS_B"
          sudo ip -n "$PULL_NS_A" addr add 10.250.0.1/24 dev trdp-va
          sudo ip -n "$PULL_NS_B" addr add 10.250.0.2/24 dev trdp-vb
          sudo ip -n "$PULL_NS_A" link set lo up
          sudo ip -n "$PULL_NS_B" link set lo up
          sudo ip -n "$PULL_NS_A" link set trdp-va up
          sudo ip -n "$PULL_NS_B" link set trdp-vb up
          sudo ip -n "$PULL_NS_A" route add 224.0.0.0/4 dev trdp-va
          sudo ip -n "$PULL_NS_B" route add 224.0.0.0/4 dev trdp-vb

          sudo ip netns exec "$PULL_NS_B" env \
            ASAN_OPTIONS="$ASAN_OPTIONS" \
            UBSAN_OPTIONS="$UBSAN_OPTIONS" \
            TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG" \
            "$PEER" pd-pull-provider 10.250.0.2 239.255.70.2 7002 4 \
            >/tmp/trdp-peer-pull.log 2>&1 &
          PULL_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"10.250.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-pd-request","kind":"pd_request","com_id":7002,"source":"10.250.0.1","destination":"10.250.0.2","reply_com_id":7002,"reply_ip":"239.255.70.2","timeout_us":0,"payload_hex":"00000000"}}'
            sleep 2
            echo '{"command":"shutdown"}'
          } | sudo ip netns exec "$PULL_NS_A" env \
                ASAN_OPTIONS="$ASAN_OPTIONS" \
                UBSAN_OPTIONS="$UBSAN_OPTIONS" \
                TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG" \
                "$BRIDGE" >/tmp/trdp-bridge-pull.log 2>&1
          wait "$PULL_PID"
          grep -q 'PD Pp comId=7002' /tmp/trdp-peer-pull.log
          grep -q '"msg_type":"Pp"' /tmp/trdp-bridge-pull.log
          grep -q '"com_id":7002' /tmp/trdp-bridge-pull.log
          grep -q '"id":"ci-pd-request"' /tmp/trdp-bridge-pull.log

          sudo ip netns exec "$PULL_NS_B" env \
            ASAN_OPTIONS="$ASAN_OPTIONS" \
            UBSAN_OPTIONS="$UBSAN_OPTIONS" \
            TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG" \
            "$PEER" pd-subscriber 10.250.0.2 10.250.0.2 7003 3 \
            >/tmp/trdp-peer-pd-tx.log 2>&1 &
          PD_TX_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"10.250.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-pd-pub","kind":"pd_publisher","com_id":7003,"source":"10.250.0.1","destination":"10.250.0.2","cycle_us":100000,"payload_hex":"01020304"}}'
            sleep 2
            echo '{"command":"shutdown"}'
          } | sudo ip netns exec "$PULL_NS_A" env \
                ASAN_OPTIONS="$ASAN_OPTIONS" \
                UBSAN_OPTIONS="$UBSAN_OPTIONS" \
                TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG" \
                "$BRIDGE" >/tmp/trdp-bridge-pd-tx.log 2>&1
          wait "$PD_TX_PID"
          grep -q 'PD Pd comId=7003' /tmp/trdp-peer-pd-tx.log
          grep -q '"command":"object_start","id":"ci-pd-pub"' /tmp/trdp-bridge-pd-tx.log
          cleanup_pull_netns

          # Verify one TauTerm object selected for Both really transmits on two
          # independent application sessions / physical links.
          sudo ip netns add "$AB_NS_A"
          sudo ip netns add "$AB_NS_B"
          sudo ip link add trdp-ab-ha type veth peer name trdp-ab-pa
          sudo ip link add trdp-ab-hb type veth peer name trdp-ab-pb
          sudo ip link set trdp-ab-pa netns "$AB_NS_A"
          sudo ip link set trdp-ab-pb netns "$AB_NS_B"
          sudo ip addr add 10.251.0.1/24 dev trdp-ab-ha
          sudo ip addr add 10.252.0.1/24 dev trdp-ab-hb
          sudo ip link set trdp-ab-ha up
          sudo ip link set trdp-ab-hb up
          sudo ip route add 224.0.0.0/4 dev trdp-ab-ha metric 251
          sudo ip route add 224.0.0.0/4 dev trdp-ab-hb metric 252
          sudo ip -n "$AB_NS_A" addr add 10.251.0.2/24 dev trdp-ab-pa
          sudo ip -n "$AB_NS_B" addr add 10.252.0.2/24 dev trdp-ab-pb
          sudo ip -n "$AB_NS_A" link set lo up
          sudo ip -n "$AB_NS_B" link set lo up
          sudo ip -n "$AB_NS_A" link set trdp-ab-pa up
          sudo ip -n "$AB_NS_B" link set trdp-ab-pb up
          sudo ip -n "$AB_NS_A" route add 224.0.0.0/4 dev trdp-ab-pa
          sudo ip -n "$AB_NS_B" route add 224.0.0.0/4 dev trdp-ab-pb

          sudo ip netns exec "$AB_NS_A" env             ASAN_OPTIONS="$ASAN_OPTIONS"             UBSAN_OPTIONS="$UBSAN_OPTIONS"             TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG"             "$PEER" pd-subscriber 10.251.0.2 239.255.71.4 7004 4             >/tmp/trdp-peer-ab-a.log 2>&1 &
          AB_A_PID=$!
          sudo ip netns exec "$AB_NS_B" env             ASAN_OPTIONS="$ASAN_OPTIONS"             UBSAN_OPTIONS="$UBSAN_OPTIONS"             TAUTERM_TRDP_DEBUG="$TAUTERM_TRDP_DEBUG"             "$PEER" pd-subscriber 10.252.0.2 239.255.71.4 7004 4             >/tmp/trdp-peer-ab-b.log 2>&1 &
          AB_B_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"10.251.0.1","link_b_enabled":true,"link_b_ip":"10.252.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-pd-both","kind":"pd_publisher","com_id":7004,"link":"both","source":"0.0.0.0","destination":"239.255.71.4","cycle_us":100000,"payload_hex":"01020304"}}'
            sleep 3
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-ab.log 2>&1
          wait "$AB_A_PID"
          wait "$AB_B_PID"
          grep -q 'PD Pd comId=7004' /tmp/trdp-peer-ab-a.log
          grep -q 'PD Pd comId=7004' /tmp/trdp-peer-ab-b.log
          cleanup_pull_netns

          "$PEER" md-replier 127.0.0.2 0.0.0.0 7100 4 >/tmp/trdp-peer-md.log 2>&1 &
          MD_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-md-request","kind":"md_request","com_id":7100,"destination":"127.0.0.2","transport":"udp","payload_hex":"01020304"}}'
            sleep 2
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-md.log 2>&1
          wait "$MD_PID"
          grep -q '"msg_type":"Mp"' /tmp/trdp-bridge-md.log

          "$PEER" md-replier 127.0.0.2 0.0.0.0 7104 3 >/tmp/trdp-peer-notify.log 2>&1 &
          NOTIFY_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-md-notify","kind":"md_notify","com_id":7104,"destination":"127.0.0.2","transport":"udp","payload_hex":"01020304"}}'
            sleep 1
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-notify.log 2>&1
          wait "$NOTIFY_PID"
          grep -q 'MD Mn comId=7104' /tmp/trdp-peer-notify.log

          "$PEER" md-replier-tcp 127.0.0.2 0.0.0.0 7101 5 >/tmp/trdp-peer-tcp.log 2>&1 &
          TCP_PID=$!
          sleep 0.5
          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-md-tcp","kind":"md_request","com_id":7101,"destination":"127.0.0.2","transport":"tcp","payload_hex":"01020304"}}'
            sleep 3
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-tcp.log 2>&1
          wait "$TCP_PID"
          grep -q '"msg_type":"Mp"' /tmp/trdp-bridge-tcp.log

          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-md-reply","kind":"md_listener","com_id":7103,"destination":"0.0.0.0","response_mode":"reply","payload_hex":"544155"}}'
            sleep 0.5
            "$PEER" md-requester 127.0.0.2 127.0.0.1 7103 3 >/tmp/trdp-peer-reply.log 2>&1
            sleep 0.5
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-reply.log 2>&1
          grep -q 'MD Mp comId=7103' /tmp/trdp-peer-reply.log

          {
            echo '{"command":"open","params":{"link_a_ip":"127.0.0.1"}}'
            echo '{"command":"object_start","object":{"id":"ci-md-query","kind":"md_listener","com_id":7102,"destination":"0.0.0.0","response_mode":"query","confirm_timeout_us":2000000,"payload_hex":"544155"}}'
            sleep 0.5
            "$PEER" md-requester 127.0.0.2 127.0.0.1 7102 3 >/tmp/trdp-peer-query.log 2>&1
            sleep 0.5
            echo '{"command":"shutdown"}'
          } | "$BRIDGE" >/tmp/trdp-bridge-query.log 2>&1
          grep -q 'MD Mq' /tmp/trdp-peer-query.log
          grep -q '"msg_type":"Mc"' /tmp/trdp-bridge-query.log

          echo 'TRDP native loopback interoperability passed.'

      - name: Install Tauri bundle smoke dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libudev-dev
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          npm ci --no-audit --no-fund

      - name: Verify TRDP sidecar is packaged in Linux deb
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAUTERM_TRDP_SANITIZE: "0"
        run: |
          set -euo pipefail
          npm run tauri -- build --config src-tauri/tauri.dev.conf.json --bundles deb
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -c "$DEB" | tee /tmp/tauterm-deb-files.txt
          grep -F 'tauterm-trdp-bridge' /tmp/tauterm-deb-files.txt

  windows:
    name: Native TRDP (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify vendored source metadata
        shell: pwsh
        run: |
          python -m py_compile scripts/vendor_tcnopen.py
          $meta = Get-Content 'src-tauri/vendor/tcnopen/SOURCE.json' -Raw | ConvertFrom-Json
          if ($meta.version -ne '3.0.0.0' -or $meta.license -ne 'MPL-2.0') { throw 'bad TCNOpen vendor metadata' }

      - name: Build vendored TCNOpen 3.0.0.0 and native helpers
        shell: pwsh
        run: ./scripts/bootstrap-trdp.ps1

      - name: Verify native artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/binaries/tauterm-trdp-bridge.exe')) { throw 'bridge missing' }
          if (-not (Test-Path 'tools/trdp-test-peer/bin/trdp-test-peer.exe')) { throw 'peer missing' }

name: Temporary Plugin Boundary Finalize

on:
  push:
    branches:
      - refactor/plugin-boundary-cleanup
    paths:
      - .github/workflows/tmp-plugin-boundary-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/plugin-boundary-cleanup
          fetch-depth: 0

      - name: Apply final patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/tmp_finalize_plugin_boundary.py")
          text = path.read_text(encoding="utf-8")
          old = '''needle = "- 插件私有运行态必须留在插件自己的 Session store/hook；公共状态栏上下文只提供 Session ID、连接状态、端点、通用参数和统计等协议无关信息。"
          if needle not in text:
              raise SystemExit("UI_FOUNDATION error-policy anchor missing")
          text = text.replace(
              needle,
              needle + "\\n- 连接/子通道失败的协议专属错误格式化由插件 registration 贡献；公共 SessionContext 只负责调用 formatter 和维护通用连接状态，不解析 UAC、SSH、TFTP 等错误文本。",
              1,
          )'''
          new = '''marker = "## 设计边界\\n\\n"
          if marker not in text:
              raise SystemExit("UI_FOUNDATION design-boundary section missing")
          text = text.replace(
              marker,
              marker + "- 连接/子通道失败的协议专属错误格式化由插件 registration 贡献；公共 SessionContext 只负责调用 formatter 和维护通用连接状态，不解析 UAC、SSH、TFTP 等错误文本。\\n",
              1,
          )'''
          if old not in text:
              raise SystemExit("temporary script documentation patch block missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/tmp_finalize_plugin_boundary.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate frontend and docs
        run: |
          npm run docs:check
          npx tsc --noEmit
          npm run check:product-integrity
          npm run check:sendbar

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Format and validate Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Commit validated fixes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/tmp-network-peer-registration.yml
          rm -f .github/workflows/tmp-network-peer-registration-v2.yml
          rm -f .github/workflows/tmp-plugin-boundary-finalize.yml
          rm -f scripts/tmp_finalize_plugin_boundary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize session data-plane activation"
          git push origin HEAD:refactor/plugin-boundary-cleanup

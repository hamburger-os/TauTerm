name: Plugin Boundary Frontend
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply asserted frontend migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/plugin-boundary-frontend.py')
          text = path.read_text(encoding='utf-8')
          old = r"r'''                    /\* 网络调试对端（非标签页树节点） \*/\n                    \{node\.peerChildren"
          new = r"r'''                    \{/\* 网络调试对端（非标签页树节点） \*/\}\n                    \{node\.peerChildren"
          if text.count(old) != 1:
              raise SystemExit(f'frontend assertion hotfix: expected 1 match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/plugin-boundary-frontend.py
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit migration and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/plugin-boundary-frontend.py .github/workflows/plugin-boundary-frontend.yml
          git add -A
          git commit -m "refactor: migrate frontend protocol runtime state into plugins"
          git push origin HEAD:refactor/plugin-boundary-cleanup

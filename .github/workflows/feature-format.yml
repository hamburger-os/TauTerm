name: Feature format
on:
  push:
    branches: [feat/transport-runtime-modbus]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
      - name: Format Rust
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: format transport and Modbus implementation'
          git push origin HEAD:feat/transport-runtime-modbus

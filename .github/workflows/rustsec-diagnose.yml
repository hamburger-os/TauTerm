name: RustSec riperf3 remediation

on:
  push:
    branches: [release/0.6.5-rustsec-fix]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.6.5-rustsec-fix

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Remove unused riperf3 RSA authentication surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text)

          def remove_unique_lines(path, exact_stripped):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              for target in exact_stripped:
                  hits = [i for i, line in enumerate(lines) if line.strip() == target]
                  if len(hits) != 1:
                      raise SystemExit(f"{path}: expected one line {target!r}, found {len(hits)}")
              lines = [line for line in lines if line.strip() not in exact_stripped]
              write(path, ''.join(lines))

          def remove_between(path, start_text, end_text):
              p = Path(path)
              lines = p.read_text().splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if start_text in line]
              ends = [i for i, line in enumerate(lines) if end_text in line]
              if len(starts) != 1:
                  raise SystemExit(f"{path}: start marker {start_text!r} count={len(starts)}")
              start = starts[0]
              end_candidates = [i for i in ends if i > start]
              if not end_candidates:
                  raise SystemExit(f"{path}: no end marker {end_text!r} after start")
              end = end_candidates[0]
              write(path, ''.join(lines[:start] + lines[end:]))

          client = "src-tauri/vendor/riperf3/src/client.rs"
          remove_unique_lines(client, {
              "pub(crate) username: Option<String>,",
              "pub(crate) password: Option<String>,",
              "pub(crate) rsa_public_key_path: Option<String>,",
              "pub(crate) use_pkcs1_padding: bool,",
              "username: Option<String>,",
              "password: Option<String>,",
              "rsa_public_key_path: Option<String>,",
              "use_pkcs1_padding: bool,",
              "username: None,",
              "password: None,",
              "rsa_public_key_path: None,",
              "use_pkcs1_padding: false,",
              "username: self.username,",
              "password: self.password,",
              "rsa_public_key_path: self.rsa_public_key_path,",
              "use_pkcs1_padding: self.use_pkcs1_padding,",
          })
          remove_between(client, "// Auth: encrypt credentials if username and public key are set", "        p\n")
          remove_between(client, "/// `--username`: username for authentication", "    // String-accepting variants")

          server = "src-tauri/vendor/riperf3/src/server.rs"
          remove_unique_lines(server, {
              "pub(crate) rsa_private_key_path: Option<String>,",
              "pub(crate) authorized_users_path: Option<String>,",
              "pub(crate) time_skew_threshold: u32,",
              "pub(crate) use_pkcs1_padding: bool,",
              "rsa_private_key_path: Option<String>,",
              "authorized_users_path: Option<String>,",
              "time_skew_threshold: u32,",
              "use_pkcs1_padding: bool,",
              "rsa_private_key_path: None,",
              "authorized_users_path: None,",
              "time_skew_threshold: 10,",
              "use_pkcs1_padding: false,",
              "rsa_private_key_path: self.rsa_private_key_path,",
              "authorized_users_path: self.authorized_users_path,",
              "time_skew_threshold: self.time_skew_threshold,",
              "use_pkcs1_padding: self.use_pkcs1_padding,",
          })
          remove_between(server, "// ---- Auth validation (after params, before streams) ----", "        // (The legacy")
          remove_between(server, "/// `--rsa-private-key-path`: path to the RSA private key", "    /// Like [`Self::server_bitrate_limit`]")

          lib = Path("src-tauri/vendor/riperf3/src/lib.rs")
          text = lib.read_text()
          if text.count("pub(crate) mod auth;\n") != 1:
              raise SystemExit("lib.rs auth module declaration changed")
          lib.write_text(text.replace("pub(crate) mod auth;\n", ""))
          Path("src-tauri/vendor/riperf3/src/auth.rs").unlink()

          manifest = Path("src-tauri/vendor/riperf3/Cargo.toml")
          text = manifest.read_text()
          for dep in ("base64", "rpassword", "rsa", "sha2"):
              pattern = rf"(?ms)^\[dependencies\.{dep}\]\n.*?(?=^\[|\Z)"
              text, count = re.subn(pattern, "", text)
              if count != 1:
                  raise SystemExit(f"Cargo.toml dependency section {dep} count={count}")
          manifest.write_text(text)

          orig = Path("src-tauri/vendor/riperf3/Cargo.toml.orig")
          lines = orig.read_text().splitlines(keepends=True)
          prefixes = ("base64.workspace", "rpassword.workspace", "rsa.workspace", "sha2.workspace")
          found = {p: 0 for p in prefixes}
          kept = []
          for line in lines:
              matched = False
              for prefix in prefixes:
                  if line.startswith(prefix):
                      found[prefix] += 1
                      matched = True
                      break
              if not matched:
                  kept.append(line)
          if any(v != 1 for v in found.values()):
              raise SystemExit(f"Cargo.toml.orig auth dependency counts: {found}")
          orig.write_text(''.join(kept))

          notes = Path("src-tauri/vendor/riperf3/VENDOR-NOTES.md")
          marker = "## 上游同步步骤\n"
          text = notes.read_text()
          if text.count(marker) != 1:
              raise SystemExit("VENDOR-NOTES upstream marker changed")
          addition = (
              "5. **移除未使用的 RSA 认证能力（RustSec 边界收敛）**：\n"
              "   - TauTerm 的 iperf3 产品契约不提供 `--username`、RSA 公私钥或 authorized-users 配置，宿主调用也从未设置这些 builder 字段；vendored fork 因此不再携带未使用的 RSA 认证模块/API。\n"
              "   - 删除 `auth.rs` 以及仅由该模块使用的 `rsa`/`base64`/`rpassword`/`sha2` 依赖，避免把 `RUSTSEC-2023-0071` 的网络可观察 RSA 时序侧信道带入 TauTerm 依赖图；若未来要提供 iperf3 认证，必须在引入前选择无该 advisory 的实现并重新完成互通与安全审查。\n\n"
          )
          notes.write_text(text.replace(marker, addition + marker))

          changelog = Path("CHANGELOG.md")
          marker = "### Fixed\n- **Serial endpoint labels and virtual bridge visibility**"
          text = changelog.read_text()
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG 0.6.5 Fixed marker changed")
          security = (
              "### Security\n"
              "- **iperf3 dependency boundary** — removes the unused RSA authentication surface from TauTerm's vendored riperf3 fork, including the `rsa` dependency affected by `RUSTSEC-2023-0071`. TauTerm's iperf3 client/server product contract does not expose RSA authentication; future authentication support must use a reviewed implementation without that advisory before it can enter the dependency graph.\n\n"
              "### Fixed\n- **Serial endpoint labels and virtual bridge visibility**"
          )
          changelog.write_text(text.replace(marker, security))
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          if grep -RInE 'crate::auth|rsa_private_key_path|rsa_public_key_path|authorized_users_path|use_pkcs1_padding|\[dependencies\.rsa\]' \
              src-tauri/vendor/riperf3/src src-tauri/vendor/riperf3/Cargo.toml; then
            echo 'Unexpected RSA authentication reference remains' >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Refresh lockfile and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          if grep -q '^name = "rsa"$' src-tauri/Cargo.lock; then
            echo 'rsa is still present in Cargo.lock' >&2
            cargo tree --manifest-path src-tauri/Cargo.toml -i rsa || true
            exit 1
          fi

      - name: Run RustSec gate
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.1
          cargo audit --file src-tauri/Cargo.lock

      - name: Commit validated remediation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git add CHANGELOG.md src-tauri/Cargo.lock src-tauri/vendor/riperf3
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'security: remove unused riperf3 RSA authentication'
          git push origin HEAD:release/0.6.5-rustsec-fix

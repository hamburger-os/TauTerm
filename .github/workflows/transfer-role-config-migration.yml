name: Transfer role config migration

on:
  push:
    branches:
      - fix/transfer-role-aware-protocol-config
    paths:
      - scripts/finish_transfer_role_config.py
      - .github/workflows/transfer-role-config-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final migration
        run: python scripts/finish_transfer_role_config.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/src docs/modules/TRANSFER.md scripts/test-file-transfer-lifecycle.mjs
          git diff --cached --quiet && exit 0
          git commit -m "refactor(transfer): complete role-aware protocol contract"
          git push

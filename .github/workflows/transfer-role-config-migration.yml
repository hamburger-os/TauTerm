name: Transfer role config migration

on:
  push:
    branches:
      - fix/transfer-role-aware-protocol-config
    paths:
      - scripts/finish_transfer_role_config.py
      - .github/workflows/transfer-role-config-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare migration matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/finish_transfer_role_config.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one occurrence, found {count}: {old[:80]!r}")\n    write(path, text.replace(old, new, 1))'''
          new = '''    if count < 1:\n        raise RuntimeError(f"{path}: expected at least one occurrence, found {count}: {old[:80]!r}")\n    write(path, text.replace(old, new, 1))'''
          if text.count(old) != 1:
              raise SystemExit("replace_once helper shape changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply migration
        run: python scripts/finish_transfer_role_config.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git diff --cached --quiet && exit 0
          git commit -m "refactor(transfer): finish role-aware protocol config"
          git push

name: Finalize Plugin Boundary
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final migration
        run: python3 .github/finalize-plugin-boundary.py
      - name: Finish Rust ownership migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def remove_test_containing(text: str, needle: str) -> str:
              pos = text.find(needle)
              if pos < 0:
                  return text
              start = text.rfind("    #[test]\n", 0, pos)
              if start < 0:
                  raise SystemExit(f"test containing {needle!r}: #[test] not found")
              brace = text.find("{", start)
              depth = 0
              end = None
              for idx in range(brace, len(text)):
                  if text[idx] == "{":
                      depth += 1
                  elif text[idx] == "}":
                      depth -= 1
                      if depth == 0:
                          end = idx + 1
                          break
              if end is None:
                  raise SystemExit(f"test containing {needle!r}: closing brace not found")
              while end < len(text) and text[end] == "\n":
                  end += 1
              return text[:start] + text[end:]

          path = Path("src-tauri/src/commands.rs")
          text = path.read_text(encoding="utf-8")
          text = remove_test_containing(text, "scrub_ssh_secrets_from_saved_sessions(&mut sessions)")
          text = remove_test_containing(text, "credential_matches_auth(")
          text = remove_test_containing(text, 'ssh_credential_account("00000000-0000-0000-0000-000000000001")')
          text = text.replace("    use crate::security::credential_store::CredentialValue;\n", "")
          path.write_text(text, encoding="utf-8")

          path = Path("src-tauri/src/kernel/session_store.rs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "        let handle = self.sessions.get_mut(parent_id).ok_or(not_found)?;\n        if handle.state != SessionState::Connected {\n            return Err(not_found);\n        }",
              "        let handle = self\n            .sessions\n            .get_mut(parent_id)\n            .ok_or_else(|| not_found.clone())?;\n        if handle.state != SessionState::Connected {\n            return Err(not_found);\n        }",
              "SessionStore parent lookup ownership",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src-tauri/src/plugins/serial/mod.rs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        if let Ok(mut manager) = state.virtual_port_manager.lock() {
            for endpoint in endpoints {
                let _ = manager.destroy_endpoint(endpoint);
            }
            if manager.pending_orphan_count() > 0 {
                log::warn!(
                    "Serial 虚拟端口清理仍有 {} 个端口对等待管理员权限；已交给显式清理动作处理",
                    manager.pending_orphan_count()
                );
            }
        }
    }''',
              '''        if let Ok(mut manager) = state.virtual_port_manager.lock() {
            for endpoint in endpoints {
                let _ = manager.destroy_endpoint(endpoint);
            }
            if manager.pending_orphan_count() > 0 {
                log::warn!(
                    "Serial 虚拟端口清理仍有 {} 个端口对等待管理员权限；已交给显式清理动作处理",
                    manager.pending_orphan_count()
                );
            }
        };
    }''',
              "Serial virtual port guard lifetime",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src-tauri/src/plugins/trdp.rs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        let workspace = services
            .session_store
            .lock()
            .ok()
            .and_then(|store| store.get_session(session_id))
            .and_then(|handle| handle.params.get("trdp_workspace"))
            .cloned();''',
              '''        let workspace = services.session_store.lock().ok().and_then(|store| {
            store
                .get_session(session_id)
                .and_then(|handle| handle.params.get("trdp_workspace"))
                .cloned()
        });''',
              "TRDP workspace guard lifetime",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Update documentation ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/modules/AUTOMATION.md")
          text = path.read_text(encoding="utf-8")
          old = "Network Debug 的目标选择由 SessionContext 拥有；`TargetBar` 只负责展示和选择，目标同步桥接把 TCP/UDP server 当前目标传给后端运行时。只有已连接的 Network Debug 会话才允许同步运行时副作用；断开、连接中或被新目标取代的异步同步不能产生陈旧状态。"
          new = "Network Debug 的目标选择、peer 列表和 targeted-send 状态由 Network 插件自己的 runtime store 拥有；公共 SendBar 只通过 `sendTarget` / `sendData` contribution 挂载目标选择和发送策略。目标同步桥接仅在已连接的 Network runtime 上执行，断开、连接中或被新目标取代的异步同步不能产生陈旧状态。"
          if text.count(old) != 1:
              raise SystemExit(f"AUTOMATION ownership paragraph expected 1 match, got {text.count(old)}")
          text = text.replace(old, new, 1)
          text = text.replace("- Network Debug 目标属于会话状态；后端目标同步只在已连接 runtime 上执行，并继续严格校验目标能力。", "- Network Debug 目标属于插件私有 Session runtime 状态；公共 SessionContext 不保存 peer/target 字段，后端目标同步只在已连接 runtime 上执行并严格校验目标能力。", 1)
          old_anchor = "- `src/components/SendBar/useNetworkSendTargetSync.ts`"
          new_anchor = "- `src/plugins/network/NetworkSendTarget.tsx`\n- `src/plugins/network/runtime-store.ts`"
          if text.count(old_anchor) != 1:
              raise SystemExit(f"AUTOMATION stale anchor expected 1 match, got {text.count(old_anchor)}")
          path.write_text(text.replace(old_anchor, new_anchor, 1), encoding="utf-8")
          PY
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Documentation contract
        run: npm run docs:check
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Commit migration and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/finalize-plugin-boundary.py .github/workflows/finalize-plugin-boundary.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor: close remaining plugin architecture boundaries"
          git push origin HEAD:refactor/plugin-boundary-cleanup

name: Focused command cleanup

on:
  push:
    branches: [fix/transport-runtime-followup]

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'run focused command cleanup' }}"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/transport-runtime-followup

      - name: Remove superseded blocking command implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/commands.rs')
          text = path.read_text(encoding='utf-8')

          def remove_section(source: str, start: str, end: str) -> str:
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f'missing start marker: {start}')
              end_index = source.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'missing end marker: {end}')
              return source[:start_index] + source[end_index:]

          text = remove_section(
              text,
              '/// 向指定会话写入数据\n',
              '/// 切换活跃标签页\n',
          )
          text = remove_section(
              text,
              '/// 关闭单个子连接（若为最后一个则自动断开父会话）。\n',
              '// ── 网络调试会话命令 ────────────────────────────────\n',
          )
          text = remove_section(
              text,
              '/// 请求 SSH PTY 窗口大小调整\n',
              '// ═══════════════════════════════════════════════════════════════\n// TFTP 协议命令\n',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/focused-command-cleanup.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src-tauri/src/commands.rs
          git diff --cached --check
          git commit -m "refactor: remove superseded blocking transport commands"
          git push origin HEAD:fix/transport-runtime-followup

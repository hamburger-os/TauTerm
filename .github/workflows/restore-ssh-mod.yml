name: Restore SSH Module
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
          fetch-depth: 0
      - name: Restore complete module and expose application policy
        run: |
          git show 22543072bbdb5b5e4796582a9bb9403cee0c54c0:src-tauri/src/plugins/ssh/mod.rs > src-tauri/src/plugins/ssh/mod.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/plugins/ssh/mod.rs')
          text = path.read_text(encoding='utf-8')
          needle = 'pub const PLUGIN_ID: &str = "ssh";\n\n'
          if text.count(needle) != 1:
              raise SystemExit('SSH module marker mismatch')
          path.write_text(text.replace(needle, needle + 'pub(crate) mod application;\n', 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit restoration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-ssh-mod.yml
          git add src-tauri/src/plugins/ssh/mod.rs
          git commit -m "fix: restore complete SSH plugin module"
          git push origin HEAD:refactor/plugin-boundary-cleanup

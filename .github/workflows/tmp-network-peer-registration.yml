name: Temporary Network Peer Registration Fix

on:
  push:
    branches:
      - refactor/plugin-boundary-cleanup
    paths:
      - .github/workflows/tmp-network-peer-registration.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/plugin-boundary-cleanup
          fetch-depth: 0

      - name: Apply peer registration ordering fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/plugins/network/mod.rs")
          text = path.read_text(encoding="utf-8")
          start = text.index("fn register_tcp_peer(")
          end = text.index("\nfn emit_udp_datagram(", start)
          replacement = r'''fn register_tcp_peer(
              app: &tauri::AppHandle,
              parent_id: &str,
              driver: TcpDriver,
              encoding: String,
              data_mode: String,
              core: Arc<NetworkCore>,
              mirror_tx: mpsc::Sender<Vec<u8>>,
          ) -> Result<String, String> {
              struct PendingPeerDisconnect {
                  info: DisconnectInfo,
                  tx_bytes: u64,
                  rx_bytes: u64,
              }

              #[derive(Default)]
              struct PeerRegistrationGate {
                  ready: bool,
                  pending: Option<PendingPeerDisconnect>,
              }

              fn finalize_disconnect(
                  app: &tauri::AppHandle,
                  parent_id: &str,
                  peer_id: &str,
                  core: &Arc<NetworkCore>,
                  disconnect_parent: bool,
                  pending: PendingPeerDisconnect,
              ) {
                  core.mark_peer_disconnected(peer_id);
                  let mut parent_was_disconnected = false;
                  if let Ok(mut store) = app.state::<crate::AppState>().session_store.lock() {
                      store.mark_sub_disconnected(
                          parent_id,
                          peer_id,
                          pending.info.retain_terminal,
                      );
                      if disconnect_parent
                          && store.session_state(parent_id) == Some(SessionState::Connected)
                      {
                          store.mark_disconnected(parent_id);
                          parent_was_disconnected = true;
                      }
                  }
                  let _ = app.emit(
                      "netdbg-peer-left",
                      serde_json::json!({
                          "session_id": parent_id,
                          "peer_id": peer_id,
                          "tx_bytes": pending.tx_bytes,
                          "rx_bytes": pending.rx_bytes,
                      }),
                  );
                  if parent_was_disconnected {
                      let _ = app.emit(
                          "session-disconnected",
                          serde_json::json!({
                              "session_id": parent_id,
                              "reason": &pending.info.reason,
                              "disconnect_info": &pending.info,
                          }),
                      );
                  }
              }

              let peer_addr = driver
                  .peer_addr()
                  .map(|value| value.to_string())
                  .unwrap_or_else(|_| "unknown".to_string());
              let local_addr = driver
                  .local_addr()
                  .map(|value| value.to_string())
                  .unwrap_or_else(|_| "unknown".to_string());
              let runtime = DataPlaneRuntime::spawn(Box::new(driver));
              let channel_id = uuid::Uuid::new_v4().to_string();
              let index = core.next_peer_index.fetch_add(1, Ordering::Relaxed);
              let peer_name = format!("Peer {}", index + 1);
              let io = Arc::new(SessionIo::new(
                  Some(runtime.handle.clone()),
                  None,
                  encoding.clone(),
              ));
              let connected_at = Some(
                  std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_millis() as u64,
              );

              let app_state = app.state::<crate::AppState>();
              let log_tx = app_state
                  .log_engine
                  .lock()
                  .map_err(|error| error.to_string())?
                  .sender();

              core.peer_handles
                  .lock()
                  .map_err(|error| error.to_string())?
                  .insert(channel_id.clone(), runtime.handle.clone());
              match core.peers.lock() {
                  Ok(mut peers) => {
                      peers.insert(
                          channel_id.clone(),
                          PeerRuntime {
                              index,
                              name: peer_name.clone(),
                              addr: peer_addr.clone(),
                              local_addr: local_addr.clone(),
                              io: io.clone(),
                              connected_at,
                              connected: true,
                          },
                      );
                  }
                  Err(error) => {
                      if let Ok(mut handles) = core.peer_handles.lock() {
                          handles.remove(&channel_id);
                      }
                      return Err(error.to_string());
                  }
              }

              let app_data = app.clone();
              let batcher = DataBatcher::new(move |batched| {
                  let _ = app_data.emit(
                      "session-data",
                      serde_json::json!({
                          "session_id": batched.session_id,
                          "data_b64": batched.data_b64,
                      }),
                  );
              });
              let encoding_log = encoding.clone();
              let data_mode_log = data_mode.clone();
              let on_data: Box<dyn Fn(String, Vec<u8>) + Send> =
                  Box::new(move |session_id, data| {
                      let payload = data.clone();
                      let mirror_payload = data.clone();
                      batcher.push(session_id.clone(), data);
                      let _ = mirror_tx.send(mirror_payload);
                      let _ = log_tx.try_send(LogEntry::SessionData(DataLogEntry {
                          session_id,
                          direction: DataDirection::RX,
                          data_mode: data_mode_log.clone(),
                          encoding: encoding_log.clone(),
                          payload,
                          timestamp: chrono::Local::now(),
                      }));
                  });

              let app_disconnect = app.clone();
              let parent_for_disconnect = parent_id.to_string();
              let peer_for_disconnect = channel_id.clone();
              let io_for_disconnect = io.clone();
              let core_for_disconnect = core.clone();
              let disconnect_parent = core.role == "client";
              let registration_gate = Arc::new(Mutex::new(PeerRegistrationGate::default()));
              let disconnect_gate = registration_gate.clone();
              let on_disconnect: Box<dyn Fn(String, DisconnectInfo) + Send> =
                  Box::new(move |_id, info| {
                      core_for_disconnect.mark_peer_disconnected(&peer_for_disconnect);
                      let pending = PendingPeerDisconnect {
                          info,
                          tx_bytes: io_for_disconnect.tx_bytes(),
                          rx_bytes: io_for_disconnect.rx_bytes(),
                      };
                      let ready_disconnect = match disconnect_gate.lock() {
                          Ok(mut gate) if gate.ready => Some(pending),
                          Ok(mut gate) => {
                              gate.pending = Some(pending);
                              None
                          }
                          Err(poisoned) => {
                              let mut gate = poisoned.into_inner();
                              if gate.ready {
                                  Some(pending)
                              } else {
                                  gate.pending = Some(pending);
                                  None
                              }
                          }
                      };
                      if let Some(pending) = ready_disconnect {
                          finalize_disconnect(
                              &app_disconnect,
                              &parent_for_disconnect,
                              &peer_for_disconnect,
                              &core_for_disconnect,
                              disconnect_parent,
                              pending,
                          );
                      }
                  });

              let data_plane = match SessionDataPlane::attach(
                  runtime,
                  channel_id.clone(),
                  on_data,
                  on_disconnect,
              ) {
                  Ok(data_plane) => data_plane,
                  Err(error) => {
                      core.remove_peer(&channel_id);
                      return Err(error.to_string());
                  }
              };
              let stats_cancel_flag = Arc::new(AtomicBool::new(false));
              SessionStore::spawn_stats_collector(
                  app.clone(),
                  channel_id.clone(),
                  io.clone(),
                  connected_at,
                  stats_cancel_flag.clone(),
              );

              let mut child = SubConnection::background(
                  channel_id.clone(),
                  peer_name.clone(),
                  data_plane,
                  io,
                  index,
              );
              child.connected_at = connected_at;
              child.stats_cancel_flag = Some(stats_cancel_flag.clone());
              let add_result = match app_state.session_store.lock() {
                  Ok(mut store) => store.add_sub_connection(parent_id, child),
                  Err(error) => Err(error.to_string()),
              };
              if let Err(error) = add_result {
                  stats_cancel_flag.store(true, Ordering::SeqCst);
                  core.remove_peer(&channel_id);
                  return Err(error);
              }

              let _ = app.emit(
                  "netdbg-peer-joined",
                  serde_json::json!({
                      "session_id": parent_id,
                      "peer_id": channel_id,
                      "peer_name": peer_name,
                      "peer_addr": peer_addr,
                      "local_addr": local_addr,
                  }),
              );

              let pending_disconnect = match registration_gate.lock() {
                  Ok(mut gate) => {
                      gate.ready = true;
                      gate.pending.take()
                  }
                  Err(poisoned) => {
                      let mut gate = poisoned.into_inner();
                      gate.ready = true;
                      gate.pending.take()
                  }
              };
              if let Some(pending) = pending_disconnect {
                  finalize_disconnect(
                      app,
                      parent_id,
                      &channel_id,
                      &core,
                      disconnect_parent,
                      pending,
                  );
              }
              Ok(channel_id)
          }
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Validate Rust
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-network-peer-registration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/plugins/network/mod.rs .github/workflows/tmp-network-peer-registration.yml
          git commit -m "fix: order network peer registration lifecycle"
          git push origin HEAD:refactor/plugin-boundary-cleanup

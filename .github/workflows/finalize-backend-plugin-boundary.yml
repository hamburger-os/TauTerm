name: Finalize Backend Plugin Boundary
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply backend plugin boundary migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/finalize-backend-plugin-boundary.py')
          text = path.read_text(encoding='utf-8')
          old_brace = "    brace = text.find('{', match.end())"
          new_brace = "    brace = text.find('{', match.start())"
          if text.count(old_brace) != 1:
              raise SystemExit(f'item parser brace marker expected 1 match, got {text.count(old_brace)}')
          text = text.replace(old_brace, new_brace, 1)
          start = text.index('alias_match = re.search(')
          end = text.index('\nsave_marker =', start)
          replacement = '''alias_start = commands.find("pub(crate) type SessionConnectFuture")
          alias_end = commands.find("macro_rules! define_session_connector", alias_start)
          if alias_start < 0 or alias_end < 0:
              raise SystemExit("Session connector aliases not found")
          connector_aliases = commands[alias_start:alias_end]
          commands = commands[:alias_start] + commands[alias_end:]
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python3 .github/finalize-backend-plugin-boundary.py
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Documentation contract
        run: npm run docs:check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Rust clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Commit migration and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/finalize-backend-plugin-boundary.py .github/workflows/finalize-backend-plugin-boundary.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor: move protocol commands behind plugin boundary"
          git push origin HEAD:refactor/plugin-boundary-cleanup

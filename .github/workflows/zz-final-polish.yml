name: Final Runtime and Modbus Polish

on:
  push:
    branches:
      - feat/transport-runtime-modbus

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0

      - name: Apply polish
        run: python3 .github/final-polish.py

      - name: Verify legacy runtime tokens are absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'SshSideChannel|TftpSideChannel|IperfSideChannel|TrdpSideChannel|NetworkSideChannel|ModbusSideChannel|get_ssh_side_channel|ProtocolConnection::side_channel|crate::channel|CommHandle|IoLoopCmd|HandoffPort|StubChannel|try_handoff|channel_return' src-tauri/src; then
            exit 1
          fi

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend and docs
        shell: bash
        run: |
          npm run docs:check
          npx tsc --noEmit

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Run Modbus tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml plugins::modbus

      - name: Commit final sources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/final-polish.py .github/workflows/zz-final-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: finalize typed runtimes and Modbus contracts'
          git push origin HEAD:feat/transport-runtime-modbus

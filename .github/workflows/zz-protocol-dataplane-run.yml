name: Protocol DataPlane Migration

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Normalize already-applied prelude
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/migrations/protocol_dataplane.py')
          s = p.read_text()
          start = s.index('# 1. Repair close metadata helper')
          end = s.index('# 2. Add one explicit protocol/session attachment hook')
          p.write_text(s[:start] + s[end:])
          PY
      - name: Apply migration
        run: python3 .github/migrations/protocol_dataplane.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[protocol-dataplane-bot] migrate SSH and Telnet transport drivers'
          git push origin HEAD:feat/transport-runtime-modbus

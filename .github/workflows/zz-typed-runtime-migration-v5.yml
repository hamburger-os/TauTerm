name: Typed Runtime Migration V5

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Apply guarded migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/zz-typed-runtime-migration-v4.yml').read_text()
          body = workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)

          section_start = script.index('# Modbus constructs one typed runtime value')
          section_end = script.index('# Network constructor uses the actual `side` value', section_start)
          replacement = r'''# Modbus constructs one typed runtime value, then exposes generic lifecycle + attach capabilities.
p='src-tauri/src/plugins/modbus/mod.rs'; t=load(p)
adapter_start=t.index('impl ProtocolAdapter for ModbusAdapter')
conn_start=t.index('        Ok(ProtocolConnection {', adapter_start)
conn_end=t.index('\n        })', conn_start) + len('\n        })')
conn=''' + "'''" + '''        let runtime = Arc::new(ModbusSideChannel {
            config,
            client,
            server,
            watch,
        });
        Ok(ProtocolConnection {
            data_plane: None,
            service: Some(runtime.clone()),
            file_transfer: None,
            channel_factory: None,
            on_attached: Some(Arc::new(RuntimeAttach { runtime })),
            teardown_delay: std::time::Duration::ZERO,
        })''' + "'''" + '''
t=t[:conn_start]+conn+t[conn_end:]
t=t.replace("    state: &State<'_, AppState>,\n    session_id: &str,", "    _state: &State<'_, AppState>,\n    session_id: &str,")
save(p,t)

'''
          script = script[:section_start] + replacement + script[section_end:]
          exec(compile(script, 'typed_runtime_v5.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev
      - name: Check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[typed-runtime-bot] remove erased protocol runtimes'
          git push origin HEAD:feat/transport-runtime-modbus

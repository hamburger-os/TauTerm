name: Plugin Boundary One Shot

on:
  push:
    branches:
      - refactor/plugin-boundary-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
          fetch-depth: 0
      - name: Apply exact boundary patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src-tauri/src/commands.rs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'use crate::virtual_port::backend::{\n    contains_elevation_indicator, VirtualEndpoint, VirtualPortConfig,\n};\nuse crate::virtual_port::bridge::VirtualPortBridge;\n',
              ''
          )

          serial_impl = r'''async fn connect_session_serial(
              app: AppHandle,
              state: State<'_, AppState>,
              request: ConnectSessionRequest,
          ) -> Result<String, String> {
              let ConnectSessionRequest {
                  endpoint,
                  params,
                  name,
                  transfer_enabled,
                  transfer_protocol,
                  send_bar_enabled,
                  session_id,
                  ..
              } = request;
              let adapter = state.plugin::<crate::plugins::serial::SerialAdapter>(
                  crate::plugins::serial::PLUGIN_ID,
              );
              let conn = adapter
                  .connect(&endpoint, &params)
                  .await
                  .map_err(|error| error.to_string())?;

              let session_name = name.unwrap_or_default();
              let data_mode = params
                  .get("data_mode")
                  .and_then(Value::as_str)
                  .unwrap_or("text")
                  .to_string();
              let encoding = params
                  .get("encoding")
                  .and_then(Value::as_str)
                  .unwrap_or("utf-8")
                  .to_string();
              let log_tx = state.log_engine.lock().map_err(|e| e.to_string())?.sender();
              let on_data = create_on_data_callback(&app, log_tx, data_mode.clone(), encoding);

              let app_disconnect = app.clone();
              let on_disconnect: Box<dyn Fn(String, DisconnectInfo) + Send> =
                  Box::new(move |session_id, info| {
                      if let Ok(mut store) = app_disconnect.state::<AppState>().session_store.lock() {
                          store.mark_disconnected(&session_id);
                      }
                      let _ = app_disconnect.emit(
                          "session-disconnected",
                          serde_json::json!({
                              "session_id": session_id,
                              "reason": &info.reason,
                              "disconnect_info": &info,
                          }),
                      );
                  });

              let transfer_enabled = transfer_enabled.unwrap_or(true);
              let transfer_protocol = transfer_protocol.unwrap_or_else(|| "ymodem".into());
              let send_bar_enabled = send_bar_enabled.unwrap_or(true);
              let sid = {
                  let mut store = state.session_store.lock().map_err(|e| e.to_string())?;
                  store.create_session(
                      SessionCreateOptions {
                          name: session_name.clone(),
                          plugin_id: crate::plugins::serial::PLUGIN_ID.into(),
                          endpoint: endpoint.clone(),
                          params: params.clone(),
                          transfer_enabled,
                          transfer_protocol: Some(transfer_protocol.clone()),
                          send_bar_enabled,
                          id_override: session_id,
                      },
                      conn,
                      on_data,
                      on_disconnect,
                      app.clone(),
                  )?
              };

              let virtual_endpoints = match adapter.runtime(&sid) {
                  Some(runtime) => runtime
                      .initialize_virtual_ports(&app, &sid, &params)
                      .unwrap_or_else(|error| {
                          log::warn!("Serial 虚拟串口 capability 初始化失败 (session={sid}): {error}");
                          let _ = app.emit(
                              "virtual-port-failed",
                              serde_json::json!({
                                  "session_id": sid,
                                  "kind": "create_failed",
                                  "reason": error,
                              }),
                          );
                          Vec::new()
                      }),
                  None => {
                      log::warn!("Serial runtime 未注册 (session={sid})");
                      Vec::new()
                  }
              };

              let (actual_name, actual_params, connected_at) = {
                  let store = state.session_store.lock().map_err(|e| e.to_string())?;
                  store
                      .get_session(&sid)
                      .map(|handle| {
                          (
                              handle.name.clone(),
                              handle.params.clone(),
                              handle.connected_at,
                          )
                      })
                      .unwrap_or((session_name, params.clone(), None))
              };

              log::info!(
                  "会话已连接: {} @ {} (data_mode={})",
                  actual_name,
                  endpoint,
                  data_mode
              );
              let _ = app.emit(
                  "session-connected",
                  serde_json::json!({
                      "session_id": sid,
                      "endpoint": endpoint,
                      "connection_type": crate::plugins::serial::PLUGIN_ID,
                      "plugin_id": crate::plugins::serial::PLUGIN_ID,
                      "name": actual_name,
                      "params": actual_params,
                      "connected_at": connected_at,
                      "transfer_enabled": transfer_enabled,
                      "transfer_protocol": transfer_protocol,
                      "send_bar_enabled": send_bar_enabled,
                      "virtual_endpoints": virtual_endpoints,
                  }),
              );
              Ok(sid)
          }

          '''
          text, count = re.subn(
              r'async fn connect_session_serial\([\s\S]*?\n}\n\n/// Telnet 会话连接',
              serial_impl + '/// Telnet 会话连接',
              text,
              count=1,
          )
          assert count == 1, 'serial connector boundary not found'

          disconnect_impl = r'''#[tauri::command]
          pub async fn disconnect_session(
              app: AppHandle,
              state: State<'_, AppState>,
              session_id: String,
          ) -> Result<(), String> {
              let (session_name, plugin_id) = {
                  let mut store = state.session_store.lock().map_err(|e| e.to_string())?;
                  let handle = store
                      .get_session(&session_id)
                      .ok_or_else(|| store.session_not_found(&session_id))?;
                  let snapshot = (handle.name.clone(), handle.plugin_id.clone());
                  store.close_session(&session_id)?;
                  store.reset_child_counter(&session_id);
                  snapshot
              };

              log::info!("会话已断开: {} ({})", session_name, plugin_id);
              if plugin_id == crate::plugins::tftp::PLUGIN_ID {
                  let _ = app.emit(
                      "tftp-server-status",
                      serde_json::json!({ "session_id": session_id, "running": false }),
                  );
              }
              if plugin_id == crate::plugins::iperf::PLUGIN_ID {
                  let _ = app.emit(
                      "iperf-server-status",
                      serde_json::json!({ "session_id": session_id, "running": false }),
                  );
              }
              let info = DisconnectInfo::user_requested();
              let _ = app.emit(
                  "session-disconnected",
                  serde_json::json!({
                      "session_id": session_id,
                      "reason": &info.reason,
                      "disconnect_info": &info,
                  }),
              );
              Ok(())
          }

          '''
          text, count = re.subn(
              r'#\[tauri::command\]\npub async fn disconnect_session\([\s\S]*?\n}\n\n/// 切换活跃标签页',
              disconnect_impl + '/// 切换活跃标签页',
              text,
              count=1,
          )
          assert count == 1, 'disconnect_session boundary not found'

          text = text.replace('if !sub.tabbed {', 'if !sub.visible_in_workspace {')
          text = text.replace(
              'continue; // 会话内对端（网络调试）不占标签页，由自定义视图展示',
              'continue; // 插件后台子连接不直接占用 Workspace 标签页'
          )

          peers_impl = r'''#[tauri::command]
          pub fn list_network_peers(
              state: State<'_, AppState>,
              session_id: String,
          ) -> Result<Vec<crate::plugins::network::NetworkPeerInfo>, String> {
              Ok(state
                  .plugin::<crate::plugins::network::NetworkAdapter>(
                      crate::plugins::network::PLUGIN_ID,
                  )
                  .list_peers(&session_id))
          }

          '''
          text, count = re.subn(
              r'#\[tauri::command\]\npub fn list_network_peers\([\s\S]*?\n}\n\n/// 关闭单个对端',
              peers_impl + '/// 关闭单个对端',
              text,
              count=1,
          )
          assert count == 1, 'list_network_peers boundary not found'

          path.write_text(text, encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plugin-boundary-one-shot.yml
          git add src-tauri/src/commands.rs src-tauri/src/kernel/session_store.rs src-tauri/src/plugins/serial/mod.rs src-tauri/src/plugins/network/mod.rs
          git commit -m "refactor(commands): delegate protocol runtime lifecycle"
          git push origin HEAD:refactor/plugin-boundary-cleanup

name: Runtime E2E

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Tauri runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Install Linux WebView/WebDriver dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev             webkit2gtk-driver xvfb

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer and debug application
        run: |
          npm run build
          cargo build --locked --manifest-path src-tauri/Cargo.toml

      - name: Install pinned E2E tooling
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Run Linux runtime smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAUTERM_E2E_BINARY: ${{ github.workspace }}/src-tauri/target/debug/tauterm
        run: xvfb-run -a npm --prefix tests/e2e test

      - name: Run Windows runtime smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAUTERM_E2E_BINARY: ${{ github.workspace }}\src-tauri\target\debug\tauterm.exe
        run: npm --prefix tests/e2e test

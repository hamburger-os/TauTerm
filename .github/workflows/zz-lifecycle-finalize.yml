name: Final Lifecycle Validation

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0

      - name: Apply lifecycle fix
        run: python3 .github/scripts/zz-lifecycle-finalize.py

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Commit lifecycle fix and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/zz-lifecycle-finalize.yml .github/scripts/zz-lifecycle-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve container teardown lifecycle'
          git push origin HEAD:feat/transport-runtime-modbus

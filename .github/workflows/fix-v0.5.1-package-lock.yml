name: Fix v0.5.1 package lock

on:
  push:
    branches:
      - release/v0.5.1
    paths:
      - .github/workflows/fix-v0.5.1-package-lock.yml

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.5.1
          persist-credentials: true

      - name: Restore the repository's existing jsesc bin path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('package-lock.json')
          text = p.read_text()
          old = '"jsesc": "bin/jsesc.js"'
          new = '"jsesc": "bin/jsesc"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --numstat -- package-lock.json)" = $'1\t1\tpackage-lock.json'
          git diff -- package-lock.json

      - name: Commit package lock correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(release): restore package lock metadata"
          git push origin HEAD:release/v0.5.1

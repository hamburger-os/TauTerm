name: Plugin Runtime Refactor

on:
  push:
    branches: [refactor/plugin-runtime-architecture]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-runtime-refactor
  cancel-in-progress: false

jobs:
  refactor-and-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/plugin-runtime-architecture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply architecture refactor
        run: |
          python3 .github/scripts/plugin_runtime_refactor.py
          python3 .github/scripts/plugin_runtime_refactor_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Validate documentation
        run: npm run docs:check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Product integrity contracts
        run: npm run check:product-integrity

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit validated refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/plugin_runtime_refactor.py
          rm .github/scripts/plugin_runtime_refactor_fix.py
          rm .github/workflows/plugin-runtime-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(core): centralize plugin runtime architecture"
          git push origin HEAD:refactor/plugin-runtime-architecture

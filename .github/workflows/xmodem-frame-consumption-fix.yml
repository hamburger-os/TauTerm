name: XModem frame consumption fix

on:
  push:
    branches:
      - fix/transfer-role-aware-protocol-config
    paths:
      - .github/workflows/xmodem-frame-consumption-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply XModem frame consumption fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/src/transfer/xmodem.rs")
          text = p.read_text(encoding="utf-8")

          start = text.index("    'init: for &check_mode in check_modes {")
          end = text.index("    let check_mode = negotiated_check.ok_or(", start)
          init_block = '''    'init: for &check_mode in check_modes {
              let mut frame_started = false;
              for _ in 0..attempts_per_mode {
                  if cancel() {
                      io::send_cancel(port);
                      return Err("传输已取消".into());
                  }

                  // 启动阶段使用 C/NAK 选择校验方式；一旦发送方已经响应数据帧，
                  // 后续失败属于同一模式内的块重传，只能使用 NAK，不能重新协商。
                  let request = if frame_started {
                      NAK
                  } else {
                      check_mode.init_byte()
                  };
                  port.write_all(&[request])?;
                  port.flush()?;

                  match read_byte_with_timeout(port, 1000)? {
                      Some(header @ (SOH | STX)) => {
                          frame_started = true;
                          // 已看到帧头后必须完整消费该帧，再判断序号/校验是否有效；
                          // 否则损坏帧的 payload 会污染下一轮帧头同步。
                          let (bnum, bnum_neg, data, valid) =
                              read_data_block(port, header, check_mode)?;
                          if bnum != !bnum_neg || bnum != 1 {
                              log::debug!(
                                  "XModem RX: invalid first block number {} (expected 1), requesting retry",
                                  bnum
                              );
                              continue;
                          }
                          if valid {
                              port.write_all(&[ACK])?;
                              port.flush()?;
                              negotiated_check = Some(check_mode);
                              first_block_data = Some((bnum, data));
                              break 'init;
                          }
                          log::debug!("XModem RX: first block checksum/CRC failed, requesting retry");
                      }
                      Some(CAN) => return Err("发送方取消了传输".into()),
                      Some(other) => log::debug!(
                          "XModem RX: received 0x{:02X} while requesting {:?}",
                          other,
                          check_mode
                      ),
                      None => {}
                  }
              }

              // Auto 只有在对端从未开始发送数据帧时才允许从 CRC16 降级到 checksum。
              // 已进入数据阶段却反复收到损坏帧时，切换校验模式会造成双方状态机失步。
              if frame_started {
                  io::send_cancel(port);
                  return Err("XModem 首个数据块重试耗尽".into());
              }
          }

          '''
          text = text[:start] + init_block + text[end:]

          start = text.index("        // ── 数据块处理 ──")
          end = text.index("        if !valid {", start)
          data_block = '''        // ── 数据块处理 ──
                  // 帧头一旦确认，就先完整读取 payload + trailer，再判断序号和校验。
                  // 这样损坏帧不会把未消费数据遗留给下一轮帧头解析。
                  let (bnum, bnum_neg, data, valid) =
                      read_data_block(port, header, check_mode)?;

                  if bnum != !bnum_neg {
                      log::warn!(
                          "XModem RX: block num mismatch ({} vs ~{}), sending NAK",
                          bnum,
                          bnum_neg
                      );
                      port.write_all(&[NAK])?;
                      port.flush()?;
                      continue;
                  }

          '''
          text = text[:start] + data_block + text[end:]

          marker = "fn verify_block(\n"
          if "fn read_data_block(" not in text:
              idx = text.index(marker)
              helper = '''fn read_data_block(
              port: &mut Box<dyn crate::transfer::protocol::TransferIo>,
              header: u8,
              check_mode: XModemCheckMode,
          ) -> Result<(u8, u8, Vec<u8>, bool), Box<dyn std::error::Error>> {
              let block_size = match header {
                  SOH => BLOCK_SIZE_128,
                  STX => BLOCK_SIZE_1K,
                  other => return Err(format!("无效的 XModem 数据帧头 0x{other:02X}").into()),
              };
              let bnum = read_or_fail(port)?;
              let bnum_neg = read_or_fail(port)?;
              let mut data = vec![0u8; block_size];
              for byte in &mut data {
                  *byte = read_or_fail(port)?;
              }
              let valid = verify_block(port, &data, check_mode)?;
              Ok((bnum, bnum_neg, data, valid))
          }

          '''
              text = text[:idx] + helper + text[idx:]

          p.write_text(text, encoding="utf-8")

          tp = Path("scripts/test-file-transfer-lifecycle.mjs")
          tests = tp.read_text(encoding="utf-8")
          marker = 'assert.match(xmodem, /bnum != !bnum_neg \\|\\| bnum != 1/);\n'
          addition = marker + 'assert.match(xmodem, /read_data_block\\(port, header, check_mode\\)\\?[\\s\\S]{0,500}bnum != !bnum_neg/);\n' + 'assert.match(xmodem, /let request = if frame_started[\\s\\S]{0,160}NAK[\\s\\S]{0,160}check_mode\\.init_byte\\(\\)/);\n'
          if "read_data_block\\(port, header, check_mode" not in tests:
              if tests.count(marker) != 1:
                  raise RuntimeError("lifecycle XModem marker mismatch")
              tests = tests.replace(marker, addition, 1)
          tp.write_text(tests, encoding="utf-8")
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/transfer/xmodem.rs scripts/test-file-transfer-lifecycle.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(transfer): consume XModem frames before retry"
          git push

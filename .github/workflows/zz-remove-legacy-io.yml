name: Remove Legacy IO

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Apply guarded migration
        run: python3 .github/migrations/remove_legacy_io.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Validate file-transfer lifecycle contract
        run: node scripts/test-file-transfer-lifecycle.mjs
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[legacy-io-bot] remove obsolete Channel and CommHandle stack'
          git push origin HEAD:feat/transport-runtime-modbus

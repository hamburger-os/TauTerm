name: Sync v0.5.1 Cargo lock

on:
  push:
    branches:
      - release/v0.5.1
    paths:
      - .github/workflows/sync-v0.5.1-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.5.1
          fetch-depth: 1
          persist-credentials: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Refresh only the workspace package version in Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import difflib

          before = Path('/tmp/Cargo.lock.before').read_text()
          after = Path('src-tauri/Cargo.lock').read_text()
          changed = [
              line for line in difflib.unified_diff(
                  before.splitlines(keepends=True),
                  after.splitlines(keepends=True),
                  fromfile='before',
                  tofile='after',
              )
              if (line.startswith('+') or line.startswith('-'))
              and not line.startswith('+++')
              and not line.startswith('---')
          ]
          expected = ['-version = "0.5.0"\n', '+version = "0.5.1"\n']
          if changed != expected:
              print('Unexpected Cargo.lock diff:')
              print(''.join(difflib.unified_diff(
                  before.splitlines(keepends=True),
                  after.splitlines(keepends=True),
                  fromfile='before',
                  tofile='after',
              )))
              raise SystemExit(1)

          blocks = after.split('[[package]]')
          tauterm = [b for b in blocks if '\nname = "tauterm"\n' in b]
          if len(tauterm) != 1 or '\nversion = "0.5.1"\n' not in tauterm[0]:
              raise SystemExit('tauterm package version was not updated exactly once')
          PY
          git diff --check
          git diff -- src-tauri/Cargo.lock

      - name: Commit synchronized Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(release): sync Cargo lock version to 0.5.1"
          git push origin HEAD:release/v0.5.1

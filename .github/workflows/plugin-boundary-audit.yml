name: Plugin Boundary Audit
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - name: Locate protocol-private frontend state
        run: |
          set +e
          for p in 'networkPeers' 'selectedNetworkPeer' 'networkManualTarget' 'networkUdpSources' 'networkLocalAddrs' 'networkBroadcast' 'sendToTarget' 'selectNetworkPeer' 'getNetworkPeers' 'mergeNetworkPeers' 'registerNetworkUdpSource' 'subscribeNetworkManualSent' 'localEcho' 'virtualVirtualEndpoints' 'virtualPortError' 'fileServiceEnabled' 'fileServiceProtocol' 'journaldEnabled'; do
            echo "===== $p ====="
            grep -R -n --exclude-dir=node_modules --exclude='SessionContext.tsx' "$p" src || true
          done
          echo '===== layout built-in branches ====='
          grep -R -n -E 'pluginId *(===|!==) *["'"'](serial|ssh|telnet|tftp|iperf|network|trdp|modbus|local-shell)["'"']' src/components/Layout src/renderers || true
      - name: Remove audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plugin-boundary-audit.yml
          git commit -m "chore: remove plugin boundary audit workflow"
          git push origin HEAD:refactor/plugin-boundary-cleanup

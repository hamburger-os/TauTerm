name: Release policy cleanup

on:
  push:
    branches:
      - release/0.6.5-policy-cleanup
    paths:
      - .github/workflows/release-policy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.6.5-policy-cleanup
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Align v0.6.5 changelog with release policy
        shell: python
        run: |
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "- **Release qualification gates** — Runtime E2E, dependency advisory checks, the release-mode performance contract and a release reliability soak are reusable exact-SHA gates in the permanent Release workflow. Hosted Windows WebView E2E explicitly reports `blocked` rather than `passed` when the known WebView2 150+ elevated-runner limitation prevents session creation; publishing then requires manual Windows validation of that exact release SHA. Version synchronization also updates TauTerm's `Cargo.lock` root-package version so `npm version` leaves all locked metadata consistent."
          new = "- **Release qualification gates** — Runtime E2E, dependency advisory checks, the release-mode performance contract and a release reliability soak are reusable exact-SHA gates in the permanent Release workflow. Hosted Windows WebView E2E explicitly reports `blocked` rather than `passed` when the known WebView2 150+ elevated-runner limitation prevents session creation; that narrowly recognized hosted-runner block remains visible as a warning without requiring a manual SHA input, while any actual Windows E2E failure remains fatal. Version synchronization also updates TauTerm's `Cargo.lock` root-package version so `npm version` leaves all locked metadata consistent."
          if text.count(old) != 1:
              raise SystemExit(f"expected one changelog policy line, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate final release policy
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "windows_validation_sha" .github/workflows/release.yml docs/community/RELEASING.md docs/community/TESTING.md CHANGELOG.md
          git diff --check
          npm ci --no-audit --no-fund
          npm run release:check -- 0.6.5
          npm run docs:check
      - name: Commit changelog alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "docs: align v0.6.5 release policy notes"
          git push origin HEAD:release/0.6.5-policy-cleanup

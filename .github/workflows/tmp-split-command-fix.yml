name: Temporary Split Command Fix

on:
  push:
    branches: [fix/split-command-availability]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/split-command-availability

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Apply split command fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path: str):
              p = Path(path)
              return p, p.read_text(encoding="utf-8").splitlines()

          def unique_index(lines, exact: str):
              hits = [i for i, line in enumerate(lines) if line == exact]
              if len(hits) != 1:
                  raise SystemExit(f"expected one line {exact!r}, found {len(hits)}")
              return hits[0]

          def write_lines(path: Path, lines):
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          core, lines = read_lines("src/core/split-layout.ts")
          start = unique_index(lines, "function updateSplitRatio(node: LayoutNode, splitId: SplitId, ratio: number): LayoutNode {")
          end = unique_index(lines, "interface ResetParentSplitResult {")
          replacement = '''function updateSplitRatio(node: LayoutNode, splitId: SplitId, ratio: number): LayoutNode {
          if (node.type === "pane") return node;
          if (node.id === splitId) {
            return node.ratio === ratio ? node : { ...node, ratio };
          }

          const first = updateSplitRatio(node.first, splitId, ratio);
          if (first !== node.first) return { ...node, first };

          const second = updateSplitRatio(node.second, splitId, ratio);
          return second === node.second ? node : { ...node, second };
          }

          export function setSplitRatioInLayout(
          state: SplitLayoutState,
          splitId: SplitId,
          ratio: number,
          ): SplitLayoutState {
          const clamped = Math.max(0.05, Math.min(0.95, ratio));
          const root = updateSplitRatio(state.root, splitId, clamped);
          return root === state.root ? state : { ...state, root };
          }

          function findParentSplitRatio(node: LayoutNode, paneId: PaneId): number | null {
          if (node.type === "pane") return null;
          const directChild = (node.first.type === "pane" && node.first.id === paneId)
            || (node.second.type === "pane" && node.second.id === paneId);
          if (directChild) return node.ratio;
          return findParentSplitRatio(node.first, paneId)
            ?? findParentSplitRatio(node.second, paneId);
          }

          /**
          * Whether resetting this Pane's immediate parent split would change geometry.
          * Command availability derives from the same immediate-parent rule as reset.
          */
          export function canResetPaneSplitRatioInLayout(
          state: SplitLayoutState,
          paneId: PaneId,
          ): boolean {
          const ratio = findParentSplitRatio(state.root, paneId);
          return ratio !== null && ratio !== 0.5;
          }

          interface ResetParentSplitResult {'''.splitlines()
          lines[start:end + 1] = replacement
          write_lines(core, lines)

          view, lines = read_lines("src/components/Layout/SplitView.tsx")
          idx = unique_index(lines, "  MAX_WORKSPACE_PANES,")
          lines.insert(idx + 1, "  canResetPaneSplitRatioInLayout,")
          idx = unique_index(lines, '    const canSplitDown = Boolean(rect && canOfferSplit(rect, "bottom"));')
          lines.insert(idx + 1, "    const canResetPaneRatio = canResetPaneSplitRatioInLayout(layout, paneMenu.paneId);")
          reset_id = unique_index(lines, '        id: "reset-pane-ratio",')
          disabled_hits = [i for i in range(reset_id, min(reset_id + 8, len(lines))) if lines[i].lstrip().startswith("disabled:")]
          if len(disabled_hits) != 1:
              raise SystemExit("could not locate reset-pane-ratio disabled line")
          lines[disabled_hits[0]] = "        disabled: !canResetPaneRatio,"
          dep = unique_index(lines, "  }, [paneMenu, paneRects, layout.assignments, canOfferSplit, paneCount, t]);")
          lines[dep] = "  }, [paneMenu, paneRects, layout.assignments, layout.root, canOfferSplit, paneCount, t]);"
          write_lines(view, lines)

          test, lines = read_lines("scripts/test-split-layout.mjs")
          idx = unique_index(lines, "  activateSessionInLayout,")
          lines.insert(idx + 1, "  canResetPaneSplitRatioInLayout,")
          idx = unique_index(lines, "assert.deepEqual(gridRects.g4, { left: 0.5, top: 0.5, width: 0.5, height: 0.5 });")
          lines[idx + 1:idx + 1] = [
              "// A balanced 2x2 grid has no meaningful reset action on any Pane.",
              'for (const paneId of ["g1", "g2", "g3", "g4"]) {',
              "  assert.equal(canResetPaneSplitRatioInLayout(grid, paneId), false);",
              "}",
              'assert.equal(canResetPaneSplitRatioInLayout(grid, "missing-pane"), false);',
          ]
          idx = unique_index(lines, 'ratioTree = setSplitRatioInLayout(ratioTree, "rs2", 0.3);')
          lines.insert(idx + 1, 'assert.equal(canResetPaneSplitRatioInLayout(ratioTree, "r1"), true);')
          idx = unique_index(lines, "assert.strictEqual(alreadyBalanced, ratioTree);")
          lines.insert(idx + 1, 'assert.equal(canResetPaneSplitRatioInLayout(ratioTree, "r1"), false);')
          set_idx = unique_index(lines, 'state = setSplitRatioInLayout(state, "s1", 2);')
          ratio_idx = next(i for i in range(set_idx + 1, set_idx + 5) if lines[i] == "assert.equal(state.root.ratio, 0.95);")
          lines[ratio_idx + 1:ratio_idx + 1] = [
              "// No-op resize writes preserve identity so React/persistence do not churn.",
              'assert.strictEqual(setSplitRatioInLayout(state, "s1", 0.95), state);',
              'assert.strictEqual(setSplitRatioInLayout(state, "missing-split", 0.5), state);',
          ]
          write_lines(test, lines)
          PY

      - name: Validate split layout and frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check:split-layout
          npx tsc --noEmit
          npm run build
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-split-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/split-layout.ts src/components/Layout/SplitView.tsx scripts/test-split-layout.mjs .github/workflows/tmp-split-command-fix.yml
          git commit -m "fix(workspace): align split command availability with layout"
          git push origin HEAD:fix/split-command-availability

name: Temporary Split Command Fix

on:
  push:
    branches: [fix/split-command-availability]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/split-command-availability

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Apply split command fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("src/core/split-layout.ts")
          text = core.read_text(encoding="utf-8")
          old = '''function updateSplitRatio(node: LayoutNode, splitId: SplitId, ratio: number): LayoutNode {
            if (node.type === "pane") return node;
            if (node.id === splitId) return { ...node, ratio };
            return {
              ...node,
              first: updateSplitRatio(node.first, splitId, ratio),
              second: updateSplitRatio(node.second, splitId, ratio),
            };
          }

          export function setSplitRatioInLayout(
            state: SplitLayoutState,
            splitId: SplitId,
            ratio: number,
          ): SplitLayoutState {
            const clamped = Math.max(0.05, Math.min(0.95, ratio));
            return { ...state, root: updateSplitRatio(state.root, splitId, clamped) };
          }

          interface ResetParentSplitResult {'''
          new = '''function updateSplitRatio(node: LayoutNode, splitId: SplitId, ratio: number): LayoutNode {
            if (node.type === "pane") return node;
            if (node.id === splitId) {
              return node.ratio === ratio ? node : { ...node, ratio };
            }

            const first = updateSplitRatio(node.first, splitId, ratio);
            if (first !== node.first) return { ...node, first };

            const second = updateSplitRatio(node.second, splitId, ratio);
            return second === node.second ? node : { ...node, second };
          }

          export function setSplitRatioInLayout(
            state: SplitLayoutState,
            splitId: SplitId,
            ratio: number,
          ): SplitLayoutState {
            const clamped = Math.max(0.05, Math.min(0.95, ratio));
            const root = updateSplitRatio(state.root, splitId, clamped);
            return root === state.root ? state : { ...state, root };
          }

          function findParentSplitRatio(node: LayoutNode, paneId: PaneId): number | null {
            if (node.type === "pane") return null;
            const directChild = (node.first.type === "pane" && node.first.id === paneId)
              || (node.second.type === "pane" && node.second.id === paneId);
            if (directChild) return node.ratio;
            return findParentSplitRatio(node.first, paneId)
              ?? findParentSplitRatio(node.second, paneId);
          }

          /**
           * Whether resetting this Pane's immediate parent split would change geometry.
           * Command availability derives from the same immediate-parent rule as reset.
           */
          export function canResetPaneSplitRatioInLayout(
            state: SplitLayoutState,
            paneId: PaneId,
          ): boolean {
            const ratio = findParentSplitRatio(state.root, paneId);
            return ratio !== null && ratio !== 0.5;
          }

          interface ResetParentSplitResult {'''
          if text.count(old) != 1:
              raise SystemExit("split-layout ratio block did not match exactly")
          core.write_text(text.replace(old, new), encoding="utf-8")

          view = Path("src/components/Layout/SplitView.tsx")
          text = view.read_text(encoding="utf-8")
          replacements = [
              (
                  'import {\n  MAX_WORKSPACE_PANES,\n  type DividerGeometry,',
                  'import {\n  MAX_WORKSPACE_PANES,\n  canResetPaneSplitRatioInLayout,\n  type DividerGeometry,',
              ),
              (
                  '  const canSplitRight = Boolean(rect && canOfferSplit(rect, "right"));\n  const canSplitDown = Boolean(rect && canOfferSplit(rect, "bottom"));\n  return [',
                  '  const canSplitRight = Boolean(rect && canOfferSplit(rect, "right"));\n  const canSplitDown = Boolean(rect && canOfferSplit(rect, "bottom"));\n  const canResetPaneRatio = canResetPaneSplitRatioInLayout(layout, paneMenu.paneId);\n  return [',
              ),
              (
                  '        disabled: paneCount <= 1,\n    },\n    { id: "pane-separator-2"',
                  '        disabled: !canResetPaneRatio,\n    },\n    { id: "pane-separator-2"',
              ),
              (
                  '  }, [paneMenu, paneRects, layout.assignments, canOfferSplit, paneCount, t]);',
                  '  }, [paneMenu, paneRects, layout.assignments, layout.root, canOfferSplit, paneCount, t]);',
              ),
          ]
          for old_part, new_part in replacements:
              if text.count(old_part) != 1:
                  raise SystemExit(f"SplitView marker did not match exactly: {old_part[:60]!r}")
              text = text.replace(old_part, new_part)
          view.write_text(text, encoding="utf-8")

          test = Path("scripts/test-split-layout.mjs")
          text = test.read_text(encoding="utf-8")
          replacements = [
              (
                  '  activateSessionInLayout,\n  clearPaneInLayout,',
                  '  activateSessionInLayout,\n  canResetPaneSplitRatioInLayout,\n  clearPaneInLayout,',
              ),
              (
                  'assert.deepEqual(gridRects.g4, { left: 0.5, top: 0.5, width: 0.5, height: 0.5 });\n\n// Resetting a Pane ratio affects only its immediate parent Split, not the outer tree.',
                  'assert.deepEqual(gridRects.g4, { left: 0.5, top: 0.5, width: 0.5, height: 0.5 });\n// A balanced 2x2 grid has no meaningful reset action on any Pane.\nfor (const paneId of ["g1", "g2", "g3", "g4"]) {\n  assert.equal(canResetPaneSplitRatioInLayout(grid, paneId), false);\n}\nassert.equal(canResetPaneSplitRatioInLayout(grid, "missing-pane"), false);\n\n// Resetting a Pane ratio affects only its immediate parent Split, not the outer tree.',
              ),
              (
                  'ratioTree = setSplitRatioInLayout(ratioTree, "rs2", 0.3);\nratioTree = resetPaneSplitRatioInLayout(ratioTree, "r1");',
                  'ratioTree = setSplitRatioInLayout(ratioTree, "rs2", 0.3);\nassert.equal(canResetPaneSplitRatioInLayout(ratioTree, "r1"), true);\nratioTree = resetPaneSplitRatioInLayout(ratioTree, "r1");',
              ),
              (
                  'const alreadyBalanced = resetPaneSplitRatioInLayout(ratioTree, "r1");\nassert.strictEqual(alreadyBalanced, ratioTree);',
                  'const alreadyBalanced = resetPaneSplitRatioInLayout(ratioTree, "r1");\nassert.strictEqual(alreadyBalanced, ratioTree);\nassert.equal(canResetPaneSplitRatioInLayout(ratioTree, "r1"), false);',
              ),
              (
                  'state = setSplitRatioInLayout(state, "s1", 2);\nassert.equal(state.root.type, "split");\nassert.equal(state.root.ratio, 0.95);',
                  'state = setSplitRatioInLayout(state, "s1", 2);\nassert.equal(state.root.type, "split");\nassert.equal(state.root.ratio, 0.95);\n// No-op resize writes preserve identity so React/persistence do not churn.\nassert.strictEqual(setSplitRatioInLayout(state, "s1", 0.95), state);\nassert.strictEqual(setSplitRatioInLayout(state, "missing-split", 0.5), state);',
              ),
          ]
          for old_part, new_part in replacements:
              if text.count(old_part) != 1:
                  raise SystemExit(f"split test marker did not match exactly: {old_part[:60]!r}")
              text = text.replace(old_part, new_part)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Validate split layout and frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check:split-layout
          npx tsc --noEmit
          npm run build
          git diff --check

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-split-command-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/split-layout.ts src/components/Layout/SplitView.tsx scripts/test-split-layout.mjs .github/workflows/tmp-split-command-fix.yml
          git commit -m "fix(workspace): align split command availability with layout"
          git push origin HEAD:fix/split-command-availability

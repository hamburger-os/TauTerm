name: Plugin Architecture Final Review

on:
  push:
    branches: [refactor/plugin-runtime-architecture]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-architecture-final-review
  cancel-in-progress: true

jobs:
  review-cleanup-and-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/plugin-runtime-architecture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final review cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/plugin_review_cleanup.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('let manifest_dir = Path::new', 'let manifest_dir = std::path::Path::new')
          text = text.replace('text = replace_once(text, old, "", label)', 'text = text.replace(old, "", 1)')
          anchor = 'text = text.replace("  /** 文件传输协议（ymodem / xmodem / zmodem） */", "  /** 文件传输协议 ID */")'
          extra = r'''
          text = replace_once(
              text,
              '  createOfflineSession: (endpoint: string, params: Record<string, unknown>, name?: string, pluginId?: string, transferEnabled?: boolean, transferProtocol?: string, sendBarEnabled?: boolean) => Promise<string | null>;',
              '  createOfflineSession: (endpoint: string, params: Record<string, unknown>, name: string | undefined, pluginId: string, transferEnabled?: boolean, transferProtocol?: string, sendBarEnabled?: boolean) => Promise<string | null>;',
              "createOfflineSession contract pluginId",
          )
          text = replace_once(
              text,
              '  const createOfflineSession = useCallback(async (endpoint: string, params: Record<string, unknown>, name?: string, pluginId?: string, transferEnabled?: boolean, transferProtocol?: string, sendBarEnabled?: boolean) => {',
              '  const createOfflineSession = useCallback(async (endpoint: string, params: Record<string, unknown>, name: string | undefined, pluginId: string, transferEnabled?: boolean, transferProtocol?: string, sendBarEnabled?: boolean) => {',
              "createOfflineSession implementation pluginId",
          )
          text = replace_once(text, '      const pid = pluginId || "serial";', '      const pid = pluginId;', "offline session serial fallback")
          text = replace_once(text, '        plugin_id?: string;', '        plugin_id: string;', "saved session plugin identity")
          text = replace_once(text, '          const pluginId = s.plugin_id || "serial";', '          const pluginId = s.plugin_id;', "saved session serial fallback")
          text = replace_once(
              text,
              '      const u2 = await listen<{ session_id: string; endpoint: string; connection_type: string; plugin_id?: string; name: string; params: Record<string, unknown>; connected_at?: number | null; transfer_enabled?: boolean; transfer_protocol?: string; send_bar_enabled?: boolean; virtual_endpoints?: VirtualPortEndpoint[]; file_service_enabled?: boolean; file_service_protocol?: string; journald_enabled?: boolean; parent_id?: string | null; channel_index?: number; elevated?: boolean; is_container?: boolean; local_addr?: string | null }>',
              '      const u2 = await listen<{ session_id: string; endpoint: string; connection_type: string; plugin_id: string; name: string; params: Record<string, unknown>; connected_at?: number | null; transfer_enabled?: boolean; transfer_protocol?: string; send_bar_enabled?: boolean; virtual_endpoints?: VirtualPortEndpoint[]; file_service_enabled?: boolean; file_service_protocol?: string; journald_enabled?: boolean; parent_id?: string | null; channel_index?: number; elevated?: boolean; is_container?: boolean; local_addr?: string | null }>',
              "session-connected plugin identity",
          )
          text = replace_once(
              text,
              '          const eventPluginId = event.payload.plugin_id || event.payload.connection_type || "serial";',
              '          const eventPluginId = event.payload.plugin_id;',
              "session-connected serial fallback",
          )
          text = replace_once(
              text,
              '                name: event.payload.name || `${(event.payload.plugin_id && pluginRegistry.get(event.payload.plugin_id)?.manifest.name) || event.payload.plugin_id?.toUpperCase() || "Serial"} @ ${event.payload.endpoint}`,' ,
              '                name: event.payload.name || `${pluginRegistry.get(eventPluginId)?.manifest.name || eventPluginId.toUpperCase()} @ ${event.payload.endpoint}`,' ,
              "session-connected Serial display fallback",
          )
          '''
          if anchor not in text:
              raise SystemExit('frontend cleanup anchor missing')
          text = text.replace(anchor, extra + '\n' + anchor, 1)
          text = text.replace("for forbidden in ['pluginId || \"serial\"', 'transferProtocol || \"ymodem\"']:", "for forbidden in [' || \"serial\"', ' || \"Serial\"', 'transferProtocol || \"ymodem\"']:")
          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/scripts/plugin_review_cleanup.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/architecture_contract.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'fn read_workspace_source(relative: &str) -> String {'
          helper = '''fn read_source(relative: &str) -> String {
              let manifest_dir = std::path::Path::new(env!("CARGO_MANIFEST_DIR"));
              std::fs::read_to_string(manifest_dir.join("src").join(relative))
                  .unwrap_or_else(|error| panic!("failed to read {relative}: {error}"))
          }

          '''
          if 'fn read_source(relative: &str)' not in text:
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')

          modbus = Path('src/plugins/modbus/ModbusConnectForm.tsx')
          source = modbus.read_text(encoding='utf-8')
          old = 'invoke<Endpoint[]>("enumerate_endpoints", { connectionType: "serial" })'
          new = 'invoke<Endpoint[]>("enumerate_endpoints", { pluginId: "serial" })'
          if source.count(old) != 1:
              raise SystemExit(f'Modbus endpoint discovery legacy call count: {source.count(old)}')
          modbus.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Documentation contract
        run: npm run docs:check

      - name: Product integrity contracts
        run: npm run check:product-integrity

      - name: Tauri blocking-command contract
        run: npm run check:tauri-blocking

      - name: Runtime error contract
        run: npm run check:runtime-errors

      - name: Terminal clipboard contract
        run: npm run check:terminal-clipboard

      - name: Engineering tool contract
        run: npm run check:engineering-tools

      - name: SendBar contract
        run: npm run check:sendbar

      - name: File-transfer contract
        run: npm run check:file-transfer

      - name: Journald contract
        run: npm run check:journald

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -E 'Some chunks are larger than|circular dependency between chunks' /tmp/frontend-build.log; then
            echo '::error::Vite/Rollup emitted a production-build warning.'
            exit 1
          fi

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/plugin_review_cleanup.py
          rm .github/workflows/plugin-review-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(core): finish plugin architecture cleanup"
          git push origin HEAD:refactor/plugin-runtime-architecture

name: Review Fixups
on:
  push:
    branches: [hardening/cross-platform-release]
    paths: [scripts/review-fixups.sh]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/cross-platform-release
          fetch-depth: 0
          persist-credentials: true
      - run: bash scripts/review-fixups.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "review: remove accidental endpoint rename fallout"
          git push origin HEAD:hardening/cross-platform-release

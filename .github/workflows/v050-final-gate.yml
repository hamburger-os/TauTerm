name: v0.5.0 Strict Final Gate

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: "${{ github.event.head_commit.message == 'chore(ci): run v0.5.0 strict final gate' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Reassemble verified refactor patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-parts/part* > /tmp/refactor.patch.gz.b64
          test "$(wc -c < /tmp/refactor.patch.gz.b64)" = "25348"
          echo "bf7742896f247fc54dc91c250a38e7aa7276c5cdc344e90f9f618245f772e79f  /tmp/refactor.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/refactor.patch.gz.b64 | gzip -dc > /tmp/refactor.patch
          test "$(wc -c < /tmp/refactor.patch)" = "98326"
          echo "27a45fa4fc00007b7e85747787724231684e00739ef529b92145bccbc212520f  /tmp/refactor.patch" | sha256sum -c -
          patch --dry-run -p1 < /tmp/refactor.patch
          patch -p1 < /tmp/refactor.patch

      - name: Normalize patched Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Apply strict follow-up fixes
        run: python3 .github/apply-v050-followup.py

      - name: Format final Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Reject Clippy suppressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '#!?\[[[:space:]]*(allow|expect)[[:space:]]*\([[:space:]]*clippy::' src-tauri/src; then
            echo '::error::Clippy allow/expect suppression found.'
            exit 1
          fi

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -F "Some chunks are larger than" /tmp/frontend-build.log; then
            echo '::error::Vite emitted a large-chunk warning.'
            exit 1
          fi

      - name: Strict Clippy all targets
        run: cargo clippy --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify formatting and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/src src-tauri/build.rs vite.config.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Strict refactor produced no source changes.'
            exit 1
          fi
          git commit -m 'refactor: eliminate all clippy warnings for v0.5.0'
          git pull --rebase origin master
          git push origin HEAD:master

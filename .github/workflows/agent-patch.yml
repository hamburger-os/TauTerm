name: Agent Patch

on:
  push:
    branches:
      - fix/ssh-session-card-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ssh-session-card-identity

      - name: Apply SSH session-card design
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          connect = Path("src/components/Layout/ConnectDialog.tsx")
          text = connect.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    if (!sshHost && isSsh) return;",
              "    if (isSsh && (!sshHost.trim() || !sshUsername.trim())) return;",
              "SSH required fields",
          )
          text = replace_once(
              text,
              "      host: sshHost,\n      port: sshPort,\n      username: sshUsername,",
              "      host: sshHost.trim(),\n      port: sshPort,\n      username: sshUsername.trim(),",
              "SSH normalized params",
          )
          text = replace_once(
              text,
              "const endpoint = isSerial ? port : (isSsh ? sshHost :",
              "const endpoint = isSerial ? port : (isSsh ? sshHost.trim() :",
              "SSH endpoint normalization",
          )
          text = replace_once(
              text,
              '    // 网络调试默认会话名：带传输层与角色（"Network Debug @ TCP Client"），\n    // 避免多个网络调试会话在左侧树里无法区分 server/client\n    const networkDefaultName =',
              '    // SSH 默认会话名表达登录身份；网络目标由侧栏第二行显示。\n    const sshDefaultName = `${pluginRegistry.get("ssh")?.manifest.name || "SSH"} @ ${sshUsername.trim()}`;\n    // 网络调试默认会话名：带传输层与角色（"Network Debug @ TCP Client"），\n    // 避免多个网络调试会话在左侧树里无法区分 server/client\n    const networkDefaultName =',
              "SSH default name",
          )
          text = replace_once(
              text,
              "        const initialSessionName = isNetwork\n          ? (sessionName || networkDefaultName)\n          : isTftp\n            ? (sessionName || tftpDefaultName)\n            : isIperf\n              ? (sessionName || iperfDefaultName)\n              : isTrdp\n                ? (sessionName || trdpDefaultName)\n                : effectiveSessionName;",
              "        const initialSessionName = isSsh\n          ? (sessionName || sshDefaultName)\n          : isNetwork\n            ? (sessionName || networkDefaultName)\n            : isTftp\n              ? (sessionName || tftpDefaultName)\n              : isIperf\n                ? (sessionName || iperfDefaultName)\n                : isTrdp\n                  ? (sessionName || trdpDefaultName)\n                  : effectiveSessionName;",
              "SSH initial session name",
          )
          text = replace_once(
              text,
              'disabled={(!port && isSerial) || (!sshHost && isSsh) || (!tftpFileRoot && isTftp) || (!telnetHost && isTelnet) || (isNetwork && netRole === "client" && !netRemoteHost) || connecting}',
              'disabled={(!port && isSerial) || (isSsh && (!sshHost.trim() || !sshUsername.trim())) || (!tftpFileRoot && isTftp) || (!telnetHost && isTelnet) || (isNetwork && netRole === "client" && !netRemoteHost) || connecting}',
              "SSH confirm disabled state",
          )
          connect.write_text(text, encoding="utf-8")

          sidebar = Path("src/components/Layout/SessionSidebar.tsx")
          text = sidebar.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "interface SessionSidebarProps {\n  onSelectSession?: (id: string) => void;\n  onEditSession?: (id: string) => void;\n  onSettingsClick?: () => void;\n  onNewSession?: () => void;\n}\n",
              "interface SessionSidebarProps {\n  onSelectSession?: (id: string) => void;\n  onEditSession?: (id: string) => void;\n  onSettingsClick?: () => void;\n  onNewSession?: () => void;\n}\n\nfunction formatHostPort(host: string, port: number): string {\n  const trimmedHost = host.trim();\n  const displayHost = trimmedHost.includes(\":\")\n    && !(trimmedHost.startsWith(\"[\") && trimmedHost.endsWith(\"]\"))\n    ? `[${trimmedHost}]`\n    : trimmedHost;\n  return `${displayHost}:${port}`;\n}\n",
              "SSH host-port formatter",
          )
          text = replace_once(
              text,
              "  const getSessionSubtitle = useCallback((tab: TabInfo): string => {\n    const params = (tab.params ?? {}) as Record<string, unknown>;\n    if (tab.pluginId === \"iperf\") {",
              "  const getSessionSubtitle = useCallback((tab: TabInfo): string => {\n    const params = (tab.params ?? {}) as Record<string, unknown>;\n    if (tab.pluginId === \"ssh\") {\n      const host = typeof params.host === \"string\" && params.host.trim()\n        ? params.host.trim()\n        : tab.endpoint;\n      const port = typeof params.port === \"number\" && Number.isInteger(params.port)\n        && params.port > 0 && params.port <= 65535\n        ? params.port\n        : 22;\n      return formatHostPort(host, port);\n    }\n    if (tab.pluginId === \"iperf\") {",
              "SSH sidebar target",
          )
          sidebar.write_text(text, encoding="utf-8")

          docs = Path("docs/modules/SSH.md")
          text = docs.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "`known_hosts.json` 只保存公开主机身份信息，不保存密码、私钥或 passphrase。\n",
              "`known_hosts.json` 只保存公开主机身份信息，不保存密码、私钥或 passphrase。\n\n### 会话身份展示\n\n新建 SSH 父会话在未填写自定义名称时，把登录身份固化为默认会话名 `SSH @ <username>`；侧栏第一行始终显示持久化会话名，第二行显示网络目标 `<host>:<port>`。默认会话名只在创建时生成，之后修改主机、端口或用户名不会隐式重写会话名；用户自定义名称同样保持不变。IPv6 目标采用 `[host]:port` 形式，避免地址与端口边界含糊。\n",
              "SSH module identity contract",
          )
          docs.write_text(text, encoding="utf-8")

          Path(".github/workflows/agent-patch.yml").unlink()
          PY

      - name: Validate patch
        run: |
          git diff --check
          npm ci
          npm run docs:check
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Layout/ConnectDialog.tsx src/components/Layout/SessionSidebar.tsx docs/modules/SSH.md .github/workflows/agent-patch.yml
          git commit -m "fix(ui): persist SSH session card identity"
          git push origin HEAD:fix/ssh-session-card-identity

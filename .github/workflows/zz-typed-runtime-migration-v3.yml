name: Typed Runtime Migration V3

on:
  push:
    branches: [feat/transport-runtime-modbus]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/transport-runtime-modbus
          fetch-depth: 0
      - name: Apply migration with registry fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/zz-typed-runtime-migration.yml').read_text()
          body = workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)
          old = """    if anchor not in t: raise SystemExit(f'registry anchor missing {path}')\n    t=t.replace(anchor,code+'\\n'+anchor,1)\n"""
          new = """    if anchor in t:\n        t=t.replace(anchor,code+'\\n'+anchor,1)\n    else:\n        struct_anchor=f'pub struct {runtime_type} {{'\n        if struct_anchor not in t: raise SystemExit(f'registry anchor missing {path}')\n        t=t.replace(struct_anchor,code+'\\n'+struct_anchor,1)\n"""
          if old not in script: raise SystemExit('migration helper anchor not found')
          exec(compile(script.replace(old, new, 1), 'typed_runtime_migration.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libudev-dev
      - name: Check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[typed-runtime-bot] remove SideChannel and Any downcasts'
          git push origin HEAD:feat/transport-runtime-modbus

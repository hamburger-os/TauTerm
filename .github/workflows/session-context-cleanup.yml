name: Session Context Boundary Cleanup
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/session-context-cleanup.py
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit cleanup and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/session-context-cleanup.py .github/workflows/session-context-cleanup.yml
          git add -A
          git commit -m "refactor: keep SessionContext protocol agnostic"
          git push origin HEAD:refactor/plugin-boundary-cleanup

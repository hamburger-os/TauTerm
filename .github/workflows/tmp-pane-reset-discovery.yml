name: Temporary Pane Reset Cleanup

on:
  push:
    branches: [fix/split-command-availability]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/split-command-availability

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Remove low-value pane reset command
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding="utf-8").splitlines()

          def save(p, lines):
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def remove_exact(path, line, expected=1):
              p, lines = load(path)
              hits = [i for i, value in enumerate(lines) if value == line]
              if len(hits) != expected:
                  raise SystemExit(f"{path}: expected {expected} matches for {line!r}, found {len(hits)}")
              lines = [value for value in lines if value != line]
              save(p, lines)

          def replace_exact(path, old, new):
              p, lines = load(path)
              hits = [i for i, value in enumerate(lines) if value == old]
              if len(hits) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {len(hits)}")
              lines[hits[0]] = new
              save(p, lines)

          # SplitView command surface and callback wiring.
          view = "src/components/Layout/SplitView.tsx"
          remove_exact(view, "  canResetPaneSplitRatioInLayout,")
          remove_exact(view, "  onResetPaneRatio: (paneId: PaneId) => void;")
          remove_exact(view, "  onResetPaneRatio,")
          remove_exact(view, "    const canResetPaneRatio = canResetPaneSplitRatioInLayout(layout, paneMenu.paneId);")
          p, lines = load(view)
          marker = '        id: "reset-pane-ratio",'
          hits = [i for i, value in enumerate(lines) if value == marker]
          if len(hits) != 1:
              raise SystemExit(f"{view}: reset menu marker count {len(hits)}")
          i = hits[0]
          if lines[i - 1] != "      {" or lines[i + 3] != "      },":
              raise SystemExit(f"{view}: reset menu shape changed")
          del lines[i - 1:i + 4]
          save(p, lines)
          replace_exact(
              view,
              "  }, [paneMenu, paneRects, layout.assignments, layout.root, canOfferSplit, paneCount, t]);",
              "  }, [paneMenu, paneRects, layout.assignments, canOfferSplit, paneCount, t]);",
          )
          p, lines = load(view)
          marker = '      case "reset-pane-ratio":'
          hits = [i for i, value in enumerate(lines) if value == marker]
          if len(hits) != 1:
              raise SystemExit(f"{view}: reset switch marker count {len(hits)}")
          i = hits[0]
          if lines[i + 1] != "        onResetPaneRatio(paneId);" or lines[i + 2] != "        break;":
              raise SystemExit(f"{view}: reset switch shape changed")
          del lines[i:i + 3]
          save(p, lines)
          replace_exact(
              view,
              "  }, [paneMenu, onClearPane, onClosePane, onResetPaneRatio, onSplitPane]);",
              "  }, [paneMenu, onClearPane, onClosePane, onSplitPane]);",
          )

          # Dispatcher callback plumbing.
          dispatcher = "src/components/TabContentDispatcher.tsx"
          remove_exact(dispatcher, "    resetPaneRatio,")
          remove_exact(dispatcher, "      onResetPaneRatio={resetPaneRatio}")

          # Context public action, callback and value exposure.
          context = "src/context/SplitLayoutContext.tsx"
          remove_exact(context, "  resetPaneSplitRatioInLayout,")
          remove_exact(context, "  resetPaneRatio: (paneId: PaneId) => void;")
          p, lines = load(context)
          start_marker = "  const resetPaneRatio = useCallback((paneId: PaneId) => {"
          hits = [i for i, value in enumerate(lines) if value == start_marker]
          if len(hits) != 1:
              raise SystemExit(f"{context}: reset callback marker count {len(hits)}")
          start = hits[0]
          end = next((i for i in range(start + 1, len(lines)) if lines[i] == "  }, []);"), None)
          if end is None:
              raise SystemExit(f"{context}: reset callback end not found")
          del lines[start:end + 1]
          if start < len(lines) and lines[start] == "":
              del lines[start]
          save(p, lines)
          remove_exact(context, "    resetPaneRatio,", expected=2)

          # Core reset implementation and capability helper.
          core = "src/core/split-layout.ts"
          p, lines = load(core)
          start_hits = [i for i, value in enumerate(lines) if value.startswith("function splitHasDirectPane(")]
          end_hits = [i for i, value in enumerate(lines) if value.startswith("export function pruneAssignments(")]
          if len(start_hits) != 1 or len(end_hits) != 1 or start_hits[0] >= end_hits[0]:
              raise SystemExit(f"{core}: reset helper boundaries changed")
          del lines[start_hits[0]:end_hits[0]]
          save(p, lines)

          # Reset-specific tests; keep ratio-write no-op coverage from the original review.
          tests = "scripts/test-split-layout.mjs"
          remove_exact(tests, "  canResetPaneSplitRatioInLayout,")
          remove_exact(tests, "  resetPaneSplitRatioInLayout,")
          p, lines = load(tests)
          start_marker = "// A balanced 2x2 grid has no meaningful reset action on any Pane."
          end_marker = "// Closing a Pane removes only the view slot and collapses its now-redundant parent split."
          start_hits = [i for i, value in enumerate(lines) if value == start_marker]
          end_hits = [i for i, value in enumerate(lines) if value == end_marker]
          if len(start_hits) != 1 or len(end_hits) != 1 or start_hits[0] >= end_hits[0]:
              raise SystemExit(f"{tests}: reset scenario boundaries changed")
          del lines[start_hits[0]:end_hits[0]]
          save(p, lines)

          # Dead translations are removed rather than retained as compatibility residue.
          for locale in ["src/i18n/locales/en-US.json", "src/i18n/locales/zh-CN.json"]:
              p, lines = load(locale)
              hits = [i for i, value in enumerate(lines) if '"resetRatio"' in value]
              if len(hits) > 1:
                  raise SystemExit(f"{locale}: multiple resetRatio keys found")
              if hits:
                  del lines[hits[0]]
                  save(p, lines)
          PY

      - name: Verify no pane reset residue remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "resetPaneSplitRatioInLayout|canResetPaneSplitRatioInLayout|onResetPaneRatio|resetPaneRatio|reset-pane-ratio|resetRatio|均分当前分屏" src scripts; then
            echo "Pane reset residue remains" >&2
            exit 1
          fi

      - name: Validate frontend and layout contracts
        run: |
          npm ci --no-audit --no-fund
          npm run check:split-layout
          npx tsc --noEmit
          npm run build
          git diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pane-reset-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(workspace): remove pane ratio reset command"
          git push origin HEAD:fix/split-command-availability

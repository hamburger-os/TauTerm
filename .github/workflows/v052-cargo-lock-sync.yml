name: v0.5.2 Cargo lock sync

on:
  push:
    branches:
      - release/v0.5.2-trust-hygiene
    paths:
      - .github/workflows/v052-cargo-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.5.2-trust-hygiene

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Synchronize workspace package lock metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.lock')
          text = path.read_text()
          old = 'name = "tauterm"\nversion = "0.5.1"'
          new = 'name = "tauterm"\nversion = "0.5.2"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one TauTerm 0.5.1 lock entry, found {text.count(old)}')
          if new in text:
              raise SystemExit('TauTerm 0.5.2 lock entry already exists unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff -- src-tauri/Cargo.lock
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const diff = execFileSync('git', ['diff', '--', 'src-tauri/Cargo.lock'], { encoding: 'utf8' });
          const changed = diff.split(/\r?\n/).filter((line) =>
            (line.startsWith('+') || line.startsWith('-')) &&
            !line.startsWith('+++') && !line.startsWith('---')
          );
          const expected = ['-version = "0.5.1"', '+version = "0.5.2"'];
          if (changed.length !== 2 || !expected.every((line) => changed.includes(line)) || !diff.includes('name = "tauterm"')) {
            console.error(diff);
            throw new Error(`unexpected Cargo.lock change: ${JSON.stringify(changed)}`);
          }
          NODE
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps >/dev/null
          node scripts/check-version.js

      - name: Remove one-shot workflow and commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v052-cargo-lock-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): sync Cargo.lock for v0.5.2'
          git push origin "HEAD:${GITHUB_REF_NAME}"

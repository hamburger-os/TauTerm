name: v0.5.2 version sync

on:
  push:
    branches:
      - release/v0.5.2-trust-hygiene
    paths:
      - .github/workflows/v052-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.5.2-trust-hygiene

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Bump synchronized version metadata
        run: npm version 0.5.2 --no-git-tag-version

      - name: Finalize v0.5.2 changelog boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'CHANGELOG.md';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('## [0.5.2]')) {
            const marker = '## [Unreleased]\n\n';
            if (!text.includes(marker)) throw new Error('Unreleased changelog marker not found');
            const release = [
              '## [0.5.2] — 2026-09-03',
              '',
              '### Security',
              '- **Credential storage trust closure** — adds cross-platform persistence contract tests for store/get/list/delete and reopen behavior, requires the headless Ubuntu CI leg to exercise the authenticated encrypted fallback, verifies the explicit v1 fallback envelope rejects unsupported versions fail-closed, retains AEAD tamper-detection coverage, and documents the credential-storage trust boundary in `SECURITY.md`. The v1 envelope is TauTerm’s first persisted fallback credential format, so there is no predecessor on-disk TauTerm format to migrate.',
              '',
            ].join('\n');
            text = text.replace(marker, marker + release + '\n');
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Verify exact release metadata
        run: npm run release:check -- 0.5.2

      - name: Remove one-shot workflow and commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v052-version-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): prepare v0.5.2 metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"

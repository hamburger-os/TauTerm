name: Temporary review hardening

on:
  push:
    branches:
      - fix/virtual-port-bridge-logging

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/virtual-port-bridge-logging
      - name: Apply review hardening
        shell: bash
        run: |
          python3 -c 'import base64; exec(base64.b64decode(""))'
      - name: Format Rust
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove temporary workflow
        shell: bash
        run: git rm .github/workflows/tmp-review-hardening.yml
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden privileged virtual-port cleanup'
          git push origin HEAD:fix/virtual-port-bridge-logging

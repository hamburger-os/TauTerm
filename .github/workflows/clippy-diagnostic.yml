name: Clippy Diagnostic

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'chore(ci): diagnose clippy' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev
      - name: Run clippy and capture output
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings > clippy.log 2>&1
          status=$?
          cat clippy.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload clippy log
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
      - name: Fail if clippy failed
        if: steps.clippy.outputs.status != '0'
        run: exit 1

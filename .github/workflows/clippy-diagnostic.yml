name: Clippy Diagnostic

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'chore(ci): diagnose clippy' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev
      - name: Rust clippy (advisory for v0.5.0)
        run: cargo clippy --no-deps --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

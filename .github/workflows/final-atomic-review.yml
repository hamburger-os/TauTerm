name: Final Atomic Review Fix
on:
  push:
    branches: [hardening/cross-platform-release]
    paths: [scripts/final-atomic-review.py]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/cross-platform-release
          persist-credentials: true
      - name: Apply final review fix
        run: python3 scripts/final-atomic-review.py
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt
      - name: Resolve lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit final review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "review: make credential vault replacement atomic"
          git push origin HEAD:hardening/cross-platform-release

name: Sync Plugin Boundary With Master
on:
  push:
    branches: [refactor/plugin-boundary-cleanup]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/plugin-boundary-cleanup
          fetch-depth: 0
      - name: Merge latest master and preserve master status-bar fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          if ! git merge --no-ff --no-edit origin/master; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'docs/modules/UI_FOUNDATION.md\nsrc/core/plugin-registry.ts\nsrc/plugins/network/index.tsx\nsrc/plugins/serial/SerialStatusItems.tsx\nsrc/plugins/ssh/index.ts\nsrc/plugins/telnet/index.ts'
            if [ "$conflicts" != "$expected" ]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "$conflicts"
              exit 1
            fi
            while IFS= read -r path; do
              git checkout --theirs -- "$path"
              git add "$path"
            done <<< "$conflicts"
            git commit --no-edit
          fi
          git rm .github/workflows/sync-plugin-boundary-master.yml
          git commit --amend --no-edit
          git push origin HEAD:refactor/plugin-boundary-cleanup

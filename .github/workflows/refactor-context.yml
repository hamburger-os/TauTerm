name: v0.5.0 Refactor Context

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  context:
    if: "${{ github.event.head_commit.message == 'chore(ci): collect v0.5.0 refactor context' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect call sites and lint suppressions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== call sites ==='
            grep -RIn -C 4 -E 'create_container_session|connect_session_network|start_journald_export|tftp_client_get|tftp_client_put|spawn_tftp_server|setup_counting_socket|file_transfer_send' src src-tauri || true
            echo
            echo '=== clippy allow/expect attributes ==='
            grep -RIn -C 2 -E '#\[(allow|expect)\(clippy' src-tauri/src || true
          } > refactor-context.txt 2>&1
          cat refactor-context.txt
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-context
          path: refactor-context.txt

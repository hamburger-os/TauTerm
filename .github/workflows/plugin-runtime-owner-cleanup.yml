name: Plugin Runtime Ownership Cleanup

on:
  push:
    branches: [refactor/plugin-runtime-architecture]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-runtime-owner-cleanup
  cancel-in-progress: true

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/plugin-runtime-architecture

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply runtime ownership cleanup
        run: python3 .github/scripts/plugin_runtime_owner_cleanup.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Documentation contract
        run: npm run docs:check

      - name: Product integrity contracts
        run: npm run check:product-integrity

      - name: Tauri blocking-command contract
        run: npm run check:tauri-blocking

      - name: Runtime error contract
        run: npm run check:runtime-errors

      - name: Terminal clipboard contract
        run: npm run check:terminal-clipboard

      - name: Engineering tool contract
        run: npm run check:engineering-tools

      - name: SendBar contract
        run: npm run check:sendbar

      - name: File-transfer contract
        run: npm run check:file-transfer

      - name: Journald contract
        run: npm run check:journald

      - name: Frontend production build without warnings
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log
          if grep -E 'Some chunks are larger than|circular dependency between chunks' /tmp/frontend-build.log; then
            echo '::error::Vite/Rollup emitted a production-build warning.'
            exit 1
          fi

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --no-deps --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Architecture hygiene
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'fn runtime_registry\(' src-tauri/src/plugins --glob 'mod.rs'; then
            echo '::error::Process-global plugin Session runtime registry remains.'
            exit 1
          fi
          git diff --check

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/plugin_runtime_owner_cleanup.py
          rm .github/workflows/plugin-runtime-owner-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(core): make plugin runtime state instance-owned"
          git push origin HEAD:refactor/plugin-runtime-architecture

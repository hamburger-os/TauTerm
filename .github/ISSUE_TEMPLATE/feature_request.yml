name: Feature request
description: Suggest a workflow or capability that would make TauTerm more useful
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests explain the engineering workflow or pain point first, not only the desired UI.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task, workflow, device or environment where TauTerm falls short.
      placeholder: I currently need to switch to another tool because...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good solution look like?
      description: Describe the behavior you would like TauTerm to support.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SSH / SFTP
        - Serial / Embedded
        - TCP/UDP Network Debug
        - File transfer
        - Automation / Lua
        - Terminal UI / UX
        - Performance
        - Cross-platform support
        - Plugin system / SDK
        - Other
    validations:
      required: true
  - type: input
    id: alternative
    attributes:
      label: What tool do you use for this today?
      description: Optional, but very useful for understanding migration blockers.
      placeholder: MobaXterm, Tabby, WindTerm, Termius, PuTTY, serial assistant, etc.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, protocol details, device constraints or examples are welcome. Remove sensitive information first.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
